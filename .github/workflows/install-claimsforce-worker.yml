name: Claimsforce Browser Worker installieren

on:
  push:
    branches:
      - main
    paths:
      - "sv-netzwerk/claimsforce-worker/**"
      - ".github/workflows/install-claimsforce-worker.yml"

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: SSH-Schlüssel einrichten
        env:
          PORTAL_SSH_KEY: ${{ secrets.PORTAL_SSH_KEY }}
          PORTAL_SFTP_HOST: ${{ secrets.PORTAL_SFTP_HOST }}
          PORTAL_SFTP_PORT: ${{ secrets.PORTAL_SFTP_PORT }}
        run: |
          set -euo pipefail
          test -n "$PORTAL_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PORTAL_SSH_KEY" > ~/.ssh/portal_key
          chmod 600 ~/.ssh/portal_key
          ssh-keyscan -p "$PORTAL_SFTP_PORT" "$PORTAL_SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Browser Worker auf dem IONOS-VPS installieren
        env:
          SFTP_HOST: ${{ secrets.PORTAL_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.PORTAL_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.PORTAL_SFTP_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$SFTP_HOST"
          test -n "$SFTP_PORT"
          test -n "$SFTP_USERNAME"
          scp -i ~/.ssh/portal_key -o IdentitiesOnly=yes -o BatchMode=yes -P "$SFTP_PORT"             sv-netzwerk/claimsforce-worker/install.sh             "$SFTP_USERNAME@$SFTP_HOST:/tmp/install-claimsforce-worker.sh"
          ssh -i ~/.ssh/portal_key -o IdentitiesOnly=yes -o BatchMode=yes -p "$SFTP_PORT"             "$SFTP_USERNAME@$SFTP_HOST"             "chmod 700 /tmp/install-claimsforce-worker.sh && /tmp/install-claimsforce-worker.sh && rm -f /tmp/install-claimsforce-worker.sh"
