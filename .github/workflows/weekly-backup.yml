name: Weekly portal backup to Google Drive

on:
  schedule:
    - cron: "0 18 * * 5"
  push:
    paths:
      - ".github/workflows/weekly-backup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SFTP_HOST: ${{ secrets.PORTAL_SFTP_HOST }}
      SFTP_USERNAME: ${{ secrets.PORTAL_SFTP_USERNAME }}
      SFTP_PORT: ${{ secrets.PORTAL_SFTP_PORT }}
      SFTP_REMOTE_DIR: ${{ secrets.PORTAL_SFTP_REMOTE_DIR }}
      PORTAL_SSH_KEY: ${{ secrets.PORTAL_SSH_KEY }}
    steps:
      - name: Prepare tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lftp default-mysql-client zip jq
          install -d -m 700 ~/.ssh ~/.lftp
          printf '%s\n' "$PORTAL_SSH_KEY" > ~/.ssh/portal_key
          chmod 600 ~/.ssh/portal_key
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' 'set sftp:connect-program "ssh -a -x -i $HOME/.ssh/portal_key -o IdentitiesOnly=yes -o BatchMode=yes"' > ~/.lftp/rc

      - name: Create database and portal archive
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/svnet-backup"
          mkdir -p "$stage/portal"
          # Der Dump läuft auf dem Portalserver mit den Zugangsdaten der Server-.env;
          # Datenbankhost und -zugang werden nicht im Workflow hinterlegt oder geraten.
          ssh -i ~/.ssh/portal_key -o IdentitiesOnly=yes -o BatchMode=yes -p "$SFTP_PORT" "$SFTP_USERNAME@$SFTP_HOST" "REMOTE_DIR='$SFTP_REMOTE_DIR' bash -s" > "$stage/database.sql" <<'REMOTE'
          set -euo pipefail
          env_get() { sed -n "s/^$1=//p" "$REMOTE_DIR/.env" | tail -n 1 | tr -d '\r'; }
          db_host="$(env_get DB_HOST)"; db_port="$(env_get DB_PORT)"
          db_name="$(env_get DB_NAME)"; db_user="$(env_get DB_USER)"; db_pass="$(env_get DB_PASS)"
          test -n "$db_name" -a -n "$db_user"
          MYSQL_PWD="$db_pass" mysqldump --single-transaction --routines --triggers --hex-blob \
            --host="${db_host:-localhost}" --port="${db_port:-3306}" --user="$db_user" "$db_name"
          REMOTE
          test -s "$stage/database.sql"
          lftp -e "set cmd:fail-exit yes; set cmd:interactive false; set sftp:auto-confirm yes; set net:timeout 25; set net:max-retries 2; open -u $SFTP_USERNAME,key-auth sftp://$SFTP_HOST:$SFTP_PORT; mirror --verbose --parallel=4 --exclude-glob '*.log' '$SFTP_REMOTE_DIR' '$stage/portal'; quit"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$stage/created_at.txt"
          archive="$RUNNER_TEMP/sv-netzwerk-backup-$(date -u +%Y-%m-%d).zip"
          (cd "$stage" && zip -r -q "$archive" database.sql created_at.txt portal)
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload archive to Google Drive
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/drive"
          mkdir -p "$stage"
          env_file="$stage/server.env"
          lftp -e "set cmd:fail-exit yes; set cmd:interactive false; set sftp:auto-confirm yes; set net:timeout 25; open -u $SFTP_USERNAME,key-auth sftp://$SFTP_HOST:$SFTP_PORT; get '$SFTP_REMOTE_DIR/.env' -o '$env_file'; quit"
          env_get() { sed -n "s/^$1=//p" "$env_file" | tail -n 1; }
          DB_HOST="$(env_get DB_HOST)"; DB_NAME="$(env_get DB_NAME)"; DB_USER="$(env_get DB_USER)"; DB_PASS="$(env_get DB_PASS)"
          client_id="$(env_get GOOGLE_DRIVE_CLIENT_ID)"
          client_secret="$(env_get GOOGLE_DRIVE_CLIENT_SECRET)"
          refresh_token="$(env_get GOOGLE_DRIVE_REFRESH_TOKEN)"
          db_setting() {
            mysql --batch --skip-column-names --host="${DB_HOST:-localhost}" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" -e "SELECT setting_value FROM app_settings WHERE setting_key='$1' LIMIT 1" 2>/dev/null | tail -n 1 || true
          }
          client_id="${client_id:-$(db_setting google_drive_client_id)}"
          client_secret="${client_secret:-$(db_setting google_drive_client_secret)}"
          refresh_token="${refresh_token:-$(db_setting google_drive_refresh_token)}"
          folder_id="$(env_get BACKUP_DRIVE_FOLDER_ID)"
          test -n "$client_id" -a -n "$client_secret" -a -n "$refresh_token"
          token_json="$(curl --fail --silent --show-error --request POST https://oauth2.googleapis.com/token --data-urlencode "client_id=$client_id" --data-urlencode "client_secret=$client_secret" --data-urlencode "refresh_token=$refresh_token" --data-urlencode "grant_type=refresh_token")"
          access_token="$(printf '%s' "$token_json" | jq -r .access_token)"
          test -n "$access_token" -a "$access_token" != null
          if [ -z "$folder_id" ]; then
            query="name = 'SV-Netzwerk Backups' and mimeType = 'application/vnd.google-apps.folder' and trashed = false"
            folders="$(curl --fail --silent --show-error --get "https://www.googleapis.com/drive/v3/files" -H "Authorization: Bearer $access_token" --data-urlencode "q=$query" --data-urlencode "fields=files(id)" --data-urlencode "pageSize=1")"
            folder_id="$(printf '%s' "$folders" | jq -r '.files[0].id // empty')"
            if [ -z "$folder_id" ]; then
              folder_json="$(curl --fail --silent --show-error -X POST "https://www.googleapis.com/drive/v3/files?fields=id&supportsAllDrives=true" -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' --data '{"name":"SV-Netzwerk Backups","mimeType":"application/vnd.google-apps.folder"}')"
              folder_id="$(printf '%s' "$folder_json" | jq -r .id)"
            fi
            test -n "$folder_id" -a "$folder_id" != null
          fi
          metadata="$(jq -n --arg name "$(basename "$ARCHIVE")" --arg parent "$folder_id" '{name:$name,parents:[$parent]}')"
          response="$(curl --fail --silent --show-error -X POST 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,name,size' -H "Authorization: Bearer $access_token" -F "metadata=$metadata;type=application/json" -F "file=@$ARCHIVE;type=application/zip")"
          printf '%s\n' "$response" | jq .
