name: EVCC server readiness (read only)
on:
  push:
    branches: [codex/evcc-server-check]
    paths: [.github/workflows/evcc-server-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect existing server without modifying services
        env:
          SERVER_HOST: ${{ secrets.PORTAL_SFTP_HOST }}
          SERVER_USER: ${{ secrets.PORTAL_SFTP_USERNAME }}
          SERVER_PORT: ${{ secrets.PORTAL_SFTP_PORT }}
          SERVER_KEY: ${{ secrets.PORTAL_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$SERVER_KEY"
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/evcc_check_key' EXIT
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/evcc_check_key
          chmod 600 ~/.ssh/evcc_check_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/evcc_check_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'sh -s' <<'CHECK'
          set -eu
          printf "OS: "; . /etc/os-release; printf "%s\n" "$PRETTY_NAME"
          printf "Architecture: "; uname -m
          printf "UID: "; id -u
          printf "Memory MiB: "; awk "/MemTotal/ {print int(\$2/1024)}" /proc/meminfo
          printf "Disk MiB available: "; df -Pm / | awk "NR==2 {print \$4}"
          for bin in systemctl docker apache2 nginx wg evcc; do
            if command -v "$bin" >/dev/null 2>&1; then printf "%s installed\n" "$bin"; fi
          done
          for service in apache2 nginx evcc docker; do
            printf "%s active: " "$service"; systemctl is-active "$service" 2>/dev/null || true
          done
          for port in 7070 8887 51820; do
            if ss -H -lntu | awk "{print \$5}" | grep -Eq ":$port$"; then
              printf "Port %s occupied\n" "$port"
            else printf "Port %s unused\n" "$port"; fi
          done
          printf "Read-only server inspection complete\n"
          CHECK
