name: SV-Netzwerk Prüfportal bereitstellen

on:
  push:
    branches:
      - main
    paths:
      - "sv-netzwerk/public/intern/**"
      - "sv-netzwerk/public/.well-known/**"
      - "sv-netzwerk/public/.htaccess"
      - "sv-netzwerk/src/pages/intern/**"
      - "sv-netzwerk/src/layouts/InternalLayout.astro"
      - "sv-netzwerk/src/styles/internal-portal.css"
      - "sv-netzwerk/src/styles/global.css"
      - "sv-netzwerk/src/styles/header.css"
      - "sv-netzwerk/src/lib/internal/**"
      - "sv-netzwerk/src/assets/sv-netzwerk-logo-portal.svg"
      - "sv-netzwerk/scripts/prepare-deploy-scope.mjs"
      - "sv-netzwerk/browser-extension/claimsforce-bridge/**"
      - "sv-netzwerk/package.json"
      - "sv-netzwerk/package-lock.json"
      - "sv-netzwerk/astro.config.mjs"
      - ".github/workflows/deploy-portal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sv-netzwerk-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sv-netzwerk
    env:
      SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js 22 LTS einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sv-netzwerk/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: ClaimsForce-Bridge-Paket aus dem Quellcode erzeugen
        run: |
          set -euo pipefail
          src=browser-extension/claimsforce-bridge
          zip_file=public/intern/downloads/svnet-claimsforce-bridge.zip
          grep -Fq '"https://www.sv-netzwerk.eu/intern/*"' "$src/manifest.json"
          grep -Fq "https://www.sv-netzwerk.eu/intern/tagescockpit/" "$src/service-worker.js"
          if grep -rnE '(^|[^A-Za-z])G:[\\/]' "$src"; then
            echo "::error::Veraltete G:-Pfade im Bridge-Quellcode."
            exit 1
          fi
          expected_version="$(node -p "require('./$src/manifest.json').version")"
          rm -f "$zip_file"
          (cd "$src" && zip -r -X "$OLDPWD/$zip_file" . -x '*.map')
          actual_version="$(unzip -p "$zip_file" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          test "$actual_version" = "$expected_version"
          echo "Bridge-Paket Version $actual_version aus $src erzeugt."
          sha256sum "$zip_file" | cut -d' ' -f1 > "$RUNNER_TEMP/bridge-zip.sha256"

      - name: Portal bauen und PHP prüfen
        run: |
          npm run build
          find public/intern -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Ausschließlich Portaldateien vorbereiten
        run: |
          node scripts/prepare-deploy-scope.mjs portal dist deploy-portal
          test -f dist/.htaccess
          test -f dist/.well-known/.htaccess
          test -f deploy-portal/.well-known/oauth-protected-resource/intern/mcp/index.php
          test -f deploy-portal/intern/versicherungsfaelle/index.php
          test -f deploy-portal/intern/auth_check.php
          test -f deploy-portal/intern/login/index.html
          test "$(head -n 1 deploy-portal/intern/versicherungsfaelle/index.php)" = "<?php require_once \$_SERVER['DOCUMENT_ROOT'] . '/intern/auth_check.php'; ?>"
          test -z "$(find deploy-portal/intern -name index.html ! -path '*/login/index.html' -print -quit)"
          test -f deploy-portal/intern/api/gf-ai-generate.php
          test -f deploy-portal/intern/deploy-version.txt
          test ! -f deploy-portal/index.html

      - name: SFTP-Werkzeug installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: SFTP-Stammverzeichnis gegen Domain-Dokumentenstamm verifizieren
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${SFTP_REMOTE_DIR:-}" ]; then
            echo "::error::Secret SFTP_REMOTE_DIR fehlt. Der IONOS-Dokumentenstamm wird nicht geraten."
            exit 1
          fi
          sftp() {
            lftp -e "set cmd:fail-exit yes; set cmd:interactive false; set sftp:auto-confirm yes; set net:timeout 25; set net:max-retries 2; open -u $SFTP_USERNAME,$SFTP_PASSWORD sftp://$SFTP_HOST:$SFTP_PORT; $1; quit"
          }
          token="$(openssl rand -hex 16)"
          probe_name="deploy-probe-${GITHUB_RUN_ID}-${token}.txt"
          probe_file="$(mktemp)"
          printf '%s\n' "$token" > "$probe_file"
          cleanup() {
            sftp "cd $SFTP_REMOTE_DIR/intern; rm -f $probe_name" >/dev/null 2>&1 || true
            rm -f "$probe_file"
          }
          trap cleanup EXIT
          if ! sftp "cd $SFTP_REMOTE_DIR/intern; put $probe_file -o $probe_name"; then
            echo "::error::SFTP_REMOTE_DIR existiert nicht oder enthält kein intern/-Verzeichnis."
            sftp "pwd; cls -1" || true
            exit 1
          fi
          live="$(curl --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "https://www.sv-netzwerk.eu/intern/$probe_name" || true)"
          if [ "$live" != "$token" ]; then
            echo "::error::SFTP_REMOTE_DIR gehört nicht zum Dokumentenstamm von www.sv-netzwerk.eu. Es wurde nichts bereitgestellt; Secret SFTP_REMOTE_DIR mit dem realen IONOS-Pfad korrigieren."
            sftp "pwd; cd $SFTP_REMOTE_DIR; pwd; cls -1" || true
            exit 1
          fi
          echo "Zuordnung bestätigt: SFTP_REMOTE_DIR liefert unter https://www.sv-netzwerk.eu/intern/ aus."

      - name: Serverkonfiguration absichern
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          PORTAL_MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          PORTAL_MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          PORTAL_MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          PORTAL_WHATSAPP_META_APP_ID: ${{ secrets.WHATSAPP_META_APP_ID }}
          PORTAL_WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          PORTAL_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${{ secrets.WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID }}
          PORTAL_WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          PORTAL_WHATSAPP_TOKEN_ENCRYPTION_KEY: ${{ secrets.WHATSAPP_TOKEN_ENCRYPTION_KEY }}
          PORTAL_WHATSAPP_APPOINTMENT_TEMPLATE: ${{ secrets.WHATSAPP_APPOINTMENT_TEMPLATE }}
          PORTAL_WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PORTAL_MS_TENANT_ID"
          test -n "$PORTAL_MS_CLIENT_ID"
          test -n "$PORTAL_MS_CLIENT_SECRET"
          test -n "$PORTAL_WHATSAPP_META_APP_ID"
          test -n "$PORTAL_WHATSAPP_APP_SECRET"
          test -n "$PORTAL_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID"
          test -n "$PORTAL_WHATSAPP_VERIFY_TOKEN"
          test -n "$PORTAL_WHATSAPP_TOKEN_ENCRYPTION_KEY"
          test -n "$PORTAL_WHATSAPP_APPOINTMENT_TEMPLATE"
          test -n "$PORTAL_WHATSAPP_ACCESS_TOKEN"
          token_response="$(curl --silent --show-error --fail \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$PORTAL_MS_CLIENT_ID" \
            --data-urlencode "client_secret=$PORTAL_MS_CLIENT_SECRET" \
            --data-urlencode 'scope=https://graph.microsoft.com/.default' \
            --data-urlencode 'grant_type=client_credentials' \
            "https://login.microsoftonline.com/$PORTAL_MS_TENANT_ID/oauth2/v2.0/token")"
          access_token="$(printf '%s' "$token_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          printf '%s' "$access_token" | python3 -c '
          import base64, json, sys
          token = sys.stdin.read().strip()
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          roles = set(json.loads(base64.urlsafe_b64decode(payload))["roles"])
          required = {"Mail.Send", "Calendars.ReadWrite", "Sites.Selected"}
          missing = sorted(required - roles)
          if missing:
              raise SystemExit("Portal-App-Berechtigungen fehlen: " + ", ".join(missing))
          print("Portal-App-Berechtigungen vollständig geprüft.")
          '
          unset access_token token_response
          config_dir="$SFTP_REMOTE_DIR"
          deploy_dir="$SFTP_REMOTE_DIR"
          env_dir="$(mktemp -d)"
          env_file="$env_dir/server.env"
          trap 'rm -f "$env_file"; rmdir "$env_dir"' EXIT
          lftp -e "set cmd:fail-exit yes; set cmd:interactive false; set sftp:auto-confirm yes; set net:timeout 25; open -u $SFTP_USERNAME,$SFTP_PASSWORD sftp://$SFTP_HOST:$SFTP_PORT; get $config_dir/.env -o $env_file; quit"
          sed -i '/^MS_TENANT_ID=/d;/^MS_CLIENT_ID=/d;/^MS_CLIENT_SECRET=/d;/^M365_TENANT_ID=/d;/^M365_CLIENT_ID=/d;/^M365_CLIENT_SECRET=/d;/^WHATSAPP_META_APP_ID=/d;/^WHATSAPP_APP_SECRET=/d;/^WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID=/d;/^WHATSAPP_VERIFY_TOKEN=/d;/^WHATSAPP_TOKEN_ENCRYPTION_KEY=/d;/^WHATSAPP_APPOINTMENT_TEMPLATE=/d;/^WHATSAPP_TEMPLATE_LANGUAGE=/d;/^WHATSAPP_ACCESS_TOKEN=/d' "$env_file"
          {
            printf 'MS_TENANT_ID=%s\n' "$PORTAL_MS_TENANT_ID"
            printf 'MS_CLIENT_ID=%s\n' "$PORTAL_MS_CLIENT_ID"
            printf 'MS_CLIENT_SECRET=%s\n' "$PORTAL_MS_CLIENT_SECRET"
            printf 'WHATSAPP_META_APP_ID=%s\n' "$PORTAL_WHATSAPP_META_APP_ID"
            printf 'WHATSAPP_APP_SECRET=%s\n' "$PORTAL_WHATSAPP_APP_SECRET"
            printf 'WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID=%s\n' "$PORTAL_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID"
            printf 'WHATSAPP_VERIFY_TOKEN=%s\n' "$PORTAL_WHATSAPP_VERIFY_TOKEN"
            printf 'WHATSAPP_TOKEN_ENCRYPTION_KEY=%s\n' "$PORTAL_WHATSAPP_TOKEN_ENCRYPTION_KEY"
            printf 'WHATSAPP_APPOINTMENT_TEMPLATE=%s\n' "$PORTAL_WHATSAPP_APPOINTMENT_TEMPLATE"
            printf 'WHATSAPP_TEMPLATE_LANGUAGE=de_AT\n'
            printf 'WHATSAPP_ACCESS_TOKEN=%s\n' "$PORTAL_WHATSAPP_ACCESS_TOKEN"
          } >> "$env_file"
          lftp -e "set cmd:fail-exit yes; set cmd:interactive false; set sftp:auto-confirm yes; set net:timeout 25; open -u $SFTP_USERNAME,$SFTP_PASSWORD sftp://$SFTP_HOST:$SFTP_PORT; put $env_file -o $config_dir/.env; quit"
          echo "Microsoft- und WhatsApp-Konfiguration sind vollständig hinterlegt."

      - name: Portalpaket ohne Serverkonfiguration übertragen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail
          echo "SFTP-DNS:"; getent hosts "$SFTP_HOST" || true
          echo "Portal-DNS:"; getent hosts www.sv-netzwerk.eu || true
          deploy_dir="$SFTP_REMOTE_DIR"
          echo "SFTP-Zielverzeichnis: $deploy_dir"
          timeout 1200s lftp -e "set cmd:fail-exit yes; set cmd:interactive false; set sftp:auto-confirm yes; set net:timeout 25; set net:max-retries 2; open -u $SFTP_USERNAME,$SFTP_PASSWORD sftp://$SFTP_HOST:$SFTP_PORT; cd $deploy_dir; put dist/.well-known/.htaccess -o .well-known/.htaccess; mirror --reverse --overwrite --parallel=4 --exclude-glob .env* --exclude-glob *.log --exclude-glob .htaccess --exclude-glob intern/photos --exclude-glob intern/photos/** --exclude-glob intern/api/config.php deploy-portal/ .; put deploy-portal/intern/versicherungsfaelle/index.php -o intern/versicherungsfaelle/index.php; put deploy-portal/intern/tagescockpit/index.php -o intern/tagescockpit/index.php; put deploy-portal/intern/arbeitszentrale/index.php -o intern/arbeitszentrale/index.php; put deploy-portal/intern/claimsforce-central.js -o intern/claimsforce-central.js; put deploy-portal/intern/deploy-version.txt -o intern/deploy-version.txt; quit"

      - name: Portal online verifizieren
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PORTAL_CHECK_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          PORTAL_CHECK_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          marker="$(curl --silent --show-error --retry 6 --retry-delay 5 https://www.sv-netzwerk.eu/intern/deploy-version.txt || true)"
          printf '%s\n' "$marker"
          if ! printf '%s\n' "$marker" | grep -Fx "Commit: $EXPECTED_SHA"; then
            echo "Portal-Servermarker fehlt oder weicht ab: falsches IONOS-Zielverzeichnis."
            exit 1
          fi
          status="$(curl --max-time 20 --silent --show-error --retry 2 -o /dev/null -w '%{http_code}' https://www.sv-netzwerk.eu/intern/login/)"
          test "$status" = "200"
          echo "/intern/login/: HTTP $status"
          headers="$(mktemp)"
          status="$(curl --max-time 20 --max-redirs 0 --silent --show-error --retry 2 -D "$headers" -o /dev/null -w '%{http_code}' https://www.sv-netzwerk.eu/intern/tagescockpit/)"
          test "$status" = "302"
          grep -Eiq '^location: /intern/login/\?next=' "$headers"
          echo "/intern/tagescockpit/: HTTP $status, Anmeldung erforderlich"
          rm -f "$headers"
          jar="$(mktemp)"
          login_body="$(mktemp)"
          jq -n --arg email "$PORTAL_CHECK_EMAIL" --arg password "$PORTAL_CHECK_PASSWORD" '{email:$email,password:$password}' > "$login_body"
          status="$(curl --max-time 20 --silent --show-error -c "$jar" -H 'Content-Type: application/json' --data @"$login_body" -o /dev/null -w '%{http_code}' 'https://www.sv-netzwerk.eu/intern/api/auth.php?action=login')"
          rm -f "$login_body"
          test "$status" = "200"
          echo "Portal-Anmeldung: HTTP $status"
          page="$(mktemp)"
          status="$(curl --max-time 20 --max-redirs 0 --silent --show-error -b "$jar" -o "$page" -w '%{http_code}' https://www.sv-netzwerk.eu/intern/tagescockpit/)"
          test "$status" = "200"
          grep -Fq 'Tagescockpit' "$page"
          echo "/intern/tagescockpit/: HTTP $status, Dashboard geladen"
          curl --max-time 20 --silent --show-error -b "$jar" -X POST -o /dev/null 'https://www.sv-netzwerk.eu/intern/api/auth.php?action=logout' || true
          rm -f "$jar" "$page"
          zip_live="$(mktemp)"
          curl --max-time 60 --silent --show-error --fail --retry 3 -o "$zip_live" https://www.sv-netzwerk.eu/intern/downloads/svnet-claimsforce-bridge.zip
          test "$(sha256sum "$zip_live" | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/bridge-zip.sha256")"
          rm -f "$zip_live"
          echo "ClaimsForce-Bridge-Paket live entspricht dem Quellcode dieses Commits."
          headers="$(mktemp)"
          status="$(curl --max-time 20 --max-redirs 0 --silent --show-error --retry 2 -D "$headers" -o /dev/null -w '%{http_code}' https://www.sv-netzwerk.eu/intern/versicherungsfaelle/)"
          test "$status" = "302"
          grep -Eiq '^location: /intern/login/\?next=' "$headers"
          echo "/intern/versicherungsfaelle/: HTTP $status, Anmeldung erforderlich"
          rm -f "$headers"
          for path in /.well-known/oauth-protected-resource /.well-known/oauth-protected-resource/intern/mcp /.well-known/oauth-protected-resource/intern/mcp/ /.well-known/oauth-authorization-server; do
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --max-redirs 0 --silent --show-error --retry 3 --retry-delay 3 -D "$headers" -o "$body" -w '%{http_code}' "https://www.sv-netzwerk.eu${path}")"
            test "$status" = "200"
            grep -Eiq '^content-type: application/json([;[:space:]]|$)' "$headers"
            node -e "const fs=require('fs'); JSON.parse(fs.readFileSync(process.argv[1],'utf8'));" "$body"
            echo "$path: HTTP $status, JSON ohne Redirect"
            rm -f "$headers" "$body"
          done








