name: WhatsApp outbound diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/whatsapp-outbound-diagnostic.yml

jobs:
  inspect-token-and-account:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect token permissions and WhatsApp assets
        env:
          ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          APP_ID: ${{ secrets.WHATSAPP_META_APP_ID }}
          APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
        run: |
          test -n "$ACCESS_TOKEN"
          test -n "$APP_ID"
          test -n "$APP_SECRET"
          echo 'TOKEN PERMISSIONS'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            'https://graph.facebook.com/v25.0/me/permissions' | jq .
          echo 'TOKEN DEBUG'
          curl --fail --silent --show-error \
            --get \
            --data-urlencode "input_token=$ACCESS_TOKEN" \
            --data-urlencode "access_token=$APP_ID|$APP_SECRET" \
            'https://graph.facebook.com/v25.0/debug_token' \
            | jq --arg expected_app "$APP_ID" '{is_valid:.data.is_valid,app_matches:((.data.app_id|tostring)==$expected_app),type:.data.type,expires_at:.data.expires_at,data_access_expires_at:.data.data_access_expires_at,scopes:.data.scopes,granular_scopes:.data.granular_scopes,user_id:.data.user_id}'
          echo 'PHONE'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            'https://graph.facebook.com/v25.0/1282747221593843?fields=id,display_phone_number,verified_name,status,quality_rating,code_verification_status,platform_type,is_official_business_account' | jq .
          echo 'WABA'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            'https://graph.facebook.com/v25.0/2484676038720950?fields=id,name,account_review_status,ownership_type' | jq .
          echo 'WABA SUBSCRIBED APP'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            'https://graph.facebook.com/v25.0/2484676038720950/subscribed_apps' \
            | jq --arg expected_app "$APP_ID" '{app_matches:any(.data[]?;(.id|tostring)==$expected_app),apps:[.data[]?|{id,name}]}'
          echo 'WABA PHONE OWNERSHIP'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            'https://graph.facebook.com/v25.0/2484676038720950/phone_numbers?fields=id,display_phone_number,status,code_verification_status' \
            | jq '{phone_matches:any(.data[]?;(.id|tostring)=="1282747221593843"),phones:[.data[]?|{id,display_phone_number,status,code_verification_status}]}'
