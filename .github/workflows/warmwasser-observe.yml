name: Observe warm water pause recovery
on:
  push:
    branches: [codex/evcc-server-check]
    paths: [.github/workflows/warmwasser-observe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read available energy inputs without changes
        env:
          SERVER_HOST: ${{ secrets.PORTAL_SFTP_HOST }}
          SERVER_USER: ${{ secrets.PORTAL_SFTP_USERNAME }}
          SERVER_PORT: ${{ secrets.PORTAL_SFTP_PORT }}
          SERVER_KEY: ${{ secrets.PORTAL_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$SERVER_KEY"
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/evcc_check_key' EXIT
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/evcc_check_key
          chmod 600 ~/.ssh/evcc_check_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/evcc_check_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'sh -s' <<'CHECK'
          set -eu
          python3 - <<'PY'
          import json,urllib.request,sqlite3,time,datetime
          con=sqlite3.connect('file:/opt/anker-homeassistant/config/home-assistant_v2.db?mode=ro',uri=True)
          names=['sensor.smart_meter_mqtt_zeit','sensor.ww_netzlast_ohne_auto','binary_sensor.ww_messung_aktuell','binary_sensor.ww_freigabe','input_boolean.ww_pause','input_boolean.ww_test','input_select.ww_vorheriger_modus']
          for i in range(20):
           rows={}
           for name in names:
            row=con.execute('SELECT s.state FROM states s JOIN states_meta m ON s.metadata_id=m.metadata_id WHERE m.entity_id=? ORDER BY s.state_id DESC LIMIT 1',(name,)).fetchone()
            rows[name]=row[0] if row else None
           try:
            with urllib.request.urlopen('http://10.77.66.1:7070/api/state',timeout=4) as r:
             d=json.load(r);d=d.get('result',d);l=d['loadpoints'][0]
             rows['evcc']={k:l.get(k) for k in ['mode','chargePower','charging','enabled']}
           except Exception as e: rows['evcc_error']=type(e).__name__
           print('OBSERVE',datetime.datetime.now(datetime.timezone.utc).isoformat(),json.dumps(rows),flush=True)
           time.sleep(5)
          PY
          CHECK
