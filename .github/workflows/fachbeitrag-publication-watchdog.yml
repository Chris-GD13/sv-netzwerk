name: Fachbeitrag Publication Watchdog

on:
  schedule:
    # Nach dem Morgenslot: Sommerzeit 07:05 CEST / Winterzeit 07:05 CET
    - cron: "5 5 * * *"
    - cron: "5 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fachbeitrag-publication-watchdog.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: fachbeitrag-publication-watchdog
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Heutigen Fachbeitrag aus Repository bestimmen
        id: article
        working-directory: sv-netzwerk
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Europe/Berlin date +%F)"
          node <<'NODE' "$TODAY" >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const path = require('path');
          const today = process.argv[2];
          const dir = path.join('src','content','knowledge');
          const files = fs.readdirSync(dir).filter(f => /\.mdx?$/.test(f));
          const rows = [];
          for (const file of files) {
            const src = fs.readFileSync(path.join(dir,file),'utf8');
            const pub = src.match(/^\s*publishedAt:\s*["']?(\d{4}-\d{2}-\d{2})/m)?.[1] || '';
            const status = src.match(/^\s*status:\s*["']?([^"'\r\n]+)/m)?.[1]?.trim() || '';
            const title = src.match(/^title:\s*["']?([^"'\r\n]+)/m)?.[1]?.trim() || '';
            if (pub === today && status === 'published') {
              rows.push({file, slug:file.replace(/\.mdx?$/,''), title});
            }
          }
          if (!rows.length) {
            console.log('found=false');
            process.exit(0);
          }
          rows.sort((a,b) => a.file.localeCompare(b.file));
          const item = rows[rows.length - 1];
          console.log('found=true');
          console.log(`slug=${item.slug}`);
          console.log(`title=${item.title.replace(/\n/g,' ')}`);
          console.log(`url=https://www.sv-netzwerk.eu/fachwissen/${item.slug}/`);
          NODE

      - name: Kein heutiger Beitrag im Repository
        if: steps.article.outputs.found != 'true'
        run: |
          echo "::error::Für heute ist im Repository kein veröffentlichter Fachbeitrag vorhanden."
          exit 1

      - name: Öffentliche Detailseite prüfen
        id: live
        if: steps.article.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.article.outputs.url }}'
          TITLE='${{ steps.article.outputs.title }}'
          BODY="$(mktemp)"
          STATUS="$(curl -L -sS -o "$BODY" -w '%{http_code}' --max-time 30 "$URL" || true)"
          if [ "$STATUS" = "200" ] && grep -Fq "$TITLE" "$BODY"; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "Beitrag ist bereits öffentlich: $URL"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "Öffentliche Prüfung fehlgeschlagen: HTTP $STATUS / Titel nicht bestätigt."
          fi

      - name: Deployment automatisch nachholen
        if: steps.article.outputs.found == 'true' && steps.live.outputs.live != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Produktiv-Deployment von main wurde automatisch gestartet."

      - name: Auf öffentliche Veröffentlichung warten
        if: steps.article.outputs.found == 'true' && steps.live.outputs.live != 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.article.outputs.url }}'
          TITLE='${{ steps.article.outputs.title }}'
          for i in $(seq 1 40); do
            BODY="$(mktemp)"
            STATUS="$(curl -L -sS -o "$BODY" -w '%{http_code}' --max-time 30 "$URL" || true)"
            if [ "$STATUS" = "200" ] && grep -Fq "$TITLE" "$BODY"; then
              echo "Öffentliche Veröffentlichung bestätigt: $URL"
              exit 0
            fi
            echo "Warte auf Deployment ($i/40): HTTP $STATUS"
            sleep 30
          done
          echo "::error::Der heutige Fachbeitrag wurde nach 20 Minuten nicht öffentlich bestätigt."
          exit 1

      - name: Fachbeitrags-Workflow zur Status-/LinkedIn-Fortsetzung anstoßen
        if: steps.article.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Europe/Berlin date +%F)"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/knowledge-standard.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"date\":\"${TODAY}\",\"slot\":\"morning\"}}"
          echo "Fachbeitrags-Automation zur Live-/LinkedIn-Fortsetzung angestoßen."
