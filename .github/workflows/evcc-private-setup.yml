name: EVCC private service setup
on:
  push:
    branches: [codex/evcc-server-check]
    paths: [.github/workflows/evcc-private-setup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install isolated evcc service bound to loopback
        env:
          SERVER_HOST: ${{ secrets.PORTAL_SFTP_HOST }}
          SERVER_USER: ${{ secrets.PORTAL_SFTP_USERNAME }}
          SERVER_PORT: ${{ secrets.PORTAL_SFTP_PORT }}
          SERVER_KEY: ${{ secrets.PORTAL_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$SERVER_KEY"
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/evcc_check_key' EXIT
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/evcc_check_key
          chmod 600 ~/.ssh/evcc_check_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/evcc_check_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'sh -s' <<'CHECK'
          set -eu
          test "$(id -u)" = 0
          if docker container inspect evcc-energy >/dev/null 2>&1; then
            echo "evcc-energy already exists; refusing to overwrite"
            exit 1
          fi
          test ! -e /opt/evcc-energy/compose.yml
          install -d -m 700 /opt/evcc-energy
          cat > /opt/evcc-energy/compose.yml <<'COMPOSE'
          services:
            evcc:
              image: evcc/evcc:0.317.2
              container_name: evcc-energy
              restart: unless-stopped
              ports:
                - "127.0.0.1:7070:7070"
                - "127.0.0.1:8887:8887"
              volumes:
                - evcc-energy-data:/root/.evcc
              security_opt:
                - no-new-privileges:true
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"
          volumes:
            evcc-energy-data:
          COMPOSE
          docker compose -f /opt/evcc-energy/compose.yml config --quiet
          docker compose -f /opt/evcc-energy/compose.yml pull
          docker compose -f /opt/evcc-energy/compose.yml up -d
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:7070/; then break; fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:7070/
          docker inspect --format '{{.State.Status}} {{.HostConfig.RestartPolicy.Name}}' evcc-energy
          docker port evcc-energy
          systemctl is-active apache2
          echo "EVCC_PRIVATE_INSTALL_VERIFIED"
          CHECK
