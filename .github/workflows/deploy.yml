name: SV-Netzwerk bereitstellen

on:
  push:
    branches:
      - main
    paths:
      - "sv-netzwerk/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sv-netzwerk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IONOS_SFTP_HOST: access-5020813808.webspace-host.com
      SFTP_REMOTE_DIR: /sv-netzwerk
      SFTP_CONNECT_TIMEOUT_SECONDS: 25
      SFTP_CHECK_TIMEOUT_SECONDS: 45
      SFTP_CHECK_ATTEMPTS: 10
      SFTP_UPLOAD_TIMEOUT_SECONDS: 1200
      SFTP_UPLOAD_ATTEMPTS: 10

    defaults:
      run:
        working-directory: sv-netzwerk

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 LTS einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sv-netzwerk/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Laufzeitumgebung prüfen
        run: |
          echo "Runner: $RUNNER_OS"
          echo "Arbeitsverzeichnis: $(pwd)"
          node --version
          npm --version
          npm config get registry
          test -f package.json
          test -f package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_PROGRESS: "false"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"
        run: npm ci --no-audit --no-fund --loglevel=notice

      - name: Supabase-Umgebungsvariablen validieren und exportieren
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          normalize_env() {
            local value="${1//$'\r'/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ "$value" =~ ^\"(.*)\"$ ]]; then
              value="${BASH_REMATCH[1]}"
            elif [[ "$value" =~ ^\'(.*)\'$ ]]; then
              value="${BASH_REMATCH[1]}"
            fi
            printf '%s' "$value"
          }

          public_supabase_url="$(normalize_env "${PUBLIC_SUPABASE_URL:-}")"
          public_supabase_anon_key="$(normalize_env "${PUBLIC_SUPABASE_ANON_KEY:-}")"

          if [ -n "$public_supabase_anon_key" ]; then
            echo "::add-mask::$public_supabase_anon_key"
          fi

          if [ -z "$public_supabase_url" ] || [ -z "$public_supabase_anon_key" ]; then
            echo "::warning::PUBLIC_SUPABASE_URL oder PUBLIC_SUPABASE_ANON_KEY ist nicht gesetzt; Supabase-Funktionen werden im Build deaktiviert."
            public_supabase_url=""
            public_supabase_anon_key=""
          elif ! [[ "$public_supabase_url" =~ ^https?:// ]]; then
            echo "::warning::PUBLIC_SUPABASE_URL ist kein gueltiger HTTP/HTTPS-URL; Supabase-Funktionen werden im Build deaktiviert."
            public_supabase_url=""
            public_supabase_anon_key=""
          else
            public_supabase_url="${public_supabase_url%/}"
            required_supabase_url='https://rsyuqqddvupbkordzylo.supabase.co'
            if [ "$public_supabase_url" != "$required_supabase_url" ]; then
              echo "::warning::PUBLIC_SUPABASE_URL zeigt nicht auf $required_supabase_url."
            fi
          fi

          printf 'PUBLIC_SUPABASE_URL=%s\n' "$public_supabase_url" >> "$GITHUB_ENV"
          printf 'PUBLIC_SUPABASE_ANON_KEY=%s\n' "$public_supabase_anon_key" >> "$GITHUB_ENV"

          printf 'PUBLIC_SUPABASE_URL=%s\nPUBLIC_SUPABASE_ANON_KEY=%s\n' "$public_supabase_url" "$public_supabase_anon_key" > .env.production

      - name: Astro-Projekt prüfen und bauen
        env:
          PUBLIC_SUPABASE_URL: ${{ env.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ env.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Build-Ausgabe prüfen
        run: |
          set -euo pipefail
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          test -f dist/deploy-version.txt
          grep -Fx "Commit: $GITHUB_SHA" dist/deploy-version.txt
          grep -Fx "Version: Homepage-v5" dist/deploy-version.txt
          test -f dist/fachwissen/hochwasser-ueberflutung-grossschadenkoordination-2026-07-20-morning/index.html
          test -f dist/fachwissen/starkregen-rueckstau-schadenaufnahme-regulierung-2026-07-20-morning/index.html
          test -f dist/fachwissen/sturm-hagel-serienschaeden-prueffolge-2026-07-21-morning/index.html
          echo "Build erfolgreich; erzeugte Dateien:"
          find dist -type f | sort | head -n 100

      - name: SFTP-Werkzeug installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp openssh-client

      - name: SFTP- und SSH-Konfiguration validieren
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          normalize_env() {
            local value="${1//$'\r'/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ "$value" =~ ^\".*\"$ ]] || [[ "$value" =~ ^\'.*\'$ ]]; then
              value="${value:1:${#value}-2}"
            fi
            printf '%s' "$value"
          }

          sftp_host="$(normalize_env "${SFTP_HOST:-}")"
          ionos_sftp_host="$(normalize_env "${IONOS_SFTP_HOST:-}")"
          sftp_port="$(normalize_env "${SFTP_PORT:-}")"
          sftp_username="$(normalize_env "${SFTP_USERNAME:-}")"
          sftp_password="$(normalize_env "${SFTP_PASSWORD:-}")"
          ssh_private_key="$(normalize_env "${SSH_PRIVATE_KEY:-}")"

          if [ -z "$ionos_sftp_host" ]; then
            echo "::error::IONOS_SFTP_HOST ist nicht gesetzt."
            exit 1
          fi

          if [ -n "$sftp_host" ] && [ "$sftp_host" != "$ionos_sftp_host" ]; then
            echo "::error::SFTP_HOST ('$sftp_host') passt nicht zum aktuellen IONOS-Host ('$ionos_sftp_host')."
            echo "::error::Bitte aktualisiere das Secret SFTP_HOST auf '$ionos_sftp_host'."
            exit 1
          fi

          sftp_host="$ionos_sftp_host"

          if [ -z "$sftp_host" ]; then
            echo "::error::SFTP_HOST ist nicht gesetzt."
            exit 1
          fi
          if [ -z "$sftp_port" ]; then
            echo "::error::SFTP_PORT ist nicht gesetzt."
            exit 1
          fi
          if [ -z "$sftp_username" ]; then
            echo "::error::SFTP_USERNAME ist nicht gesetzt."
            exit 1
          fi

          if ! [[ "$sftp_port" =~ ^[0-9]+$ ]] || [ "$sftp_port" -lt 1 ] || [ "$sftp_port" -gt 65535 ]; then
            echo "::error::SFTP_PORT ist ungültig: '$sftp_port'."
            exit 1
          fi

          if [ -z "$sftp_password" ] && [ -z "$ssh_private_key" ]; then
            echo "::error::Weder SFTP_PASSWORD noch SSH_PRIVATE_KEY ist gesetzt."
            exit 1
          fi

          if [ -n "$sftp_password" ]; then
            echo "::add-mask::$sftp_password"
          fi

          key_file=""
          if [ -n "$ssh_private_key" ]; then
            echo "::add-mask::$ssh_private_key"
            key_file="$RUNNER_TEMP/sftp_id_key"
            umask 077
            printf '%s\n' "$ssh_private_key" > "$key_file"
            chmod 600 "$key_file"
          fi

          printf 'SFTP_HOST=%s\n' "$sftp_host" >> "$GITHUB_ENV"
          printf 'SFTP_PORT=%s\n' "$sftp_port" >> "$GITHUB_ENV"
          printf 'SFTP_USERNAME=%s\n' "$sftp_username" >> "$GITHUB_ENV"
          printf 'SFTP_PASSWORD=%s\n' "$sftp_password" >> "$GITHUB_ENV"
          printf 'SFTP_SSH_KEY_FILE=%s\n' "$key_file" >> "$GITHUB_ENV"

      - name: Known Hosts und Fingerprint verifizieren
        env:
          SFTP_HOST_FINGERPRINT: ${{ secrets.SFTP_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          known_hosts_file="$RUNNER_TEMP/sftp_known_hosts"
          keyscan_stderr="$RUNNER_TEMP/sftp_keyscan_stderr.log"
          : > "$known_hosts_file"
          : > "$keyscan_stderr"

          scan_targets=("$SFTP_HOST")
          if resolved_ips="$(getent ahosts "$SFTP_HOST" 2>/dev/null | awk '{print $1}' | sort -u)"; then
            while IFS= read -r ip; do
              if [ -n "$ip" ]; then
                scan_targets+=("$ip")
              fi
            done <<< "$resolved_ips"
          fi

          for target in "${scan_targets[@]}"; do
            if ! ssh-keyscan -t rsa,ecdsa,ed25519 -p "$SFTP_PORT" -T "$SFTP_CONNECT_TIMEOUT_SECONDS" "$target" >> "$known_hosts_file" 2>> "$keyscan_stderr"; then
              echo "::warning::ssh-keyscan für Target '$target' lieferte einen Exit-Code ungleich 0; prüfe Ausgabe."
            fi
          done

          sed -i '/^[[:space:]]*$/d' "$known_hosts_file"
          sort -u -o "$known_hosts_file" "$known_hosts_file"

          if [ ! -s "$known_hosts_file" ]; then
            if [ -s "$keyscan_stderr" ]; then
              cat "$keyscan_stderr"
            fi
            echo "::error::Es konnte kein Host-Key von $SFTP_HOST:$SFTP_PORT gelesen werden."
            exit 1
          fi

          if ! fingerprints="$(ssh-keygen -lf "$known_hosts_file" | awk '{print $2}' | sort -u)"; then
            echo "::error::Fingerprints konnten aus known_hosts nicht gelesen werden."
            exit 1
          fi
          if [ -z "$fingerprints" ]; then
            echo "::error::Es konnten keine Fingerprints aus known_hosts ermittelt werden."
            exit 1
          fi

          echo "Ermittelte SFTP-Host-Fingerprints:"
          printf '%s\n' "$fingerprints"

          expected_fingerprint="$(printf '%s' "${SFTP_HOST_FINGERPRINT:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "$expected_fingerprint" ]; then
            if ! printf '%s\n' "$fingerprints" | grep -Fxq "$expected_fingerprint"; then
              echo "::error::SFTP_HOST_FINGERPRINT stimmt nicht mit dem Server-Fingerprint überein."
              echo "Erwartet: $expected_fingerprint"
              echo "Erhalten:"
              printf '%s\n' "$fingerprints"
              exit 1
            fi
          else
            echo "::warning::SFTP_HOST_FINGERPRINT ist nicht gesetzt; Host-Key wird ohne Referenz-Fingerprint übernommen."
          fi

          install -m 600 "$known_hosts_file" "$HOME/.ssh/known_hosts"
          printf 'SFTP_KNOWN_HOSTS_FILE=%s\n' "$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Document Root vor dem Upload prüfen
        run: |
          set -euo pipefail
          auth_value="$SFTP_USERNAME"
          if [ -n "${SFTP_PASSWORD:-}" ]; then
            auth_value="$SFTP_USERNAME,$SFTP_PASSWORD"
          fi
          ssh_opts="-a -x -p $SFTP_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SFTP_KNOWN_HOSTS_FILE -o GlobalKnownHostsFile=/dev/null"
          if [ -n "${SFTP_SSH_KEY_FILE:-}" ]; then
            ssh_opts="$ssh_opts -i $SFTP_SSH_KEY_FILE"
          fi
          lftp_script="set cmd:fail-exit yes; set cmd:interactive false; set net:timeout $SFTP_CONNECT_TIMEOUT_SECONDS; set net:max-retries 1; set net:reconnect-interval-base 5; set net:reconnect-interval-multiplier 1; set sftp:connect-program \"ssh $ssh_opts\"; open -u $auth_value sftp://$SFTP_HOST:$SFTP_PORT; ls -la $SFTP_REMOTE_DIR; quit"
          exit_code=1
          listing=""
          for attempt in $(seq 1 "$SFTP_CHECK_ATTEMPTS"); do
            set +e
            listing="$(timeout "${SFTP_CHECK_TIMEOUT_SECONDS}s" lftp -e "$lftp_script")"
            exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt "$SFTP_CHECK_ATTEMPTS" ]; then
              sleep 15
            fi
          done
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ]; then
              echo "::error::Timeout bei Document-Root-Prüfung nach ${SFTP_CHECK_TIMEOUT_SECONDS}s."
            else
              echo "::error::Document Root $SFTP_REMOTE_DIR ist nicht erreichbar oder nicht nutzbar (Exit $exit_code)."
            fi
            exit 1
          fi
          printf '%s\n' "$listing"

          if printf '%s\n' "$listing" | grep -Eq '(^|/)dist/$'; then
            echo "::error::$SFTP_REMOTE_DIR/dist/ existiert bereits. Upload wird abgebrochen."
            exit 1
          fi

      - name: Inhalt von dist nach IONOS übertragen
        run: |
          set -euo pipefail
          auth_value="$SFTP_USERNAME"
          if [ -n "${SFTP_PASSWORD:-}" ]; then
            auth_value="$SFTP_USERNAME,$SFTP_PASSWORD"
          fi
          ssh_opts="-a -x -p $SFTP_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SFTP_KNOWN_HOSTS_FILE -o GlobalKnownHostsFile=/dev/null"
          if [ -n "${SFTP_SSH_KEY_FILE:-}" ]; then
            ssh_opts="$ssh_opts -i $SFTP_SSH_KEY_FILE"
          fi
          lftp_script="set cmd:fail-exit yes; set cmd:interactive false; set net:timeout $SFTP_CONNECT_TIMEOUT_SECONDS; set net:max-retries 1; set net:reconnect-interval-base 5; set net:reconnect-interval-multiplier 1; set sftp:connect-program \"ssh $ssh_opts\"; open -u $auth_value sftp://$SFTP_HOST:$SFTP_PORT; mirror --reverse --delete --exclude-glob .git* --exclude-glob .env* dist $SFTP_REMOTE_DIR/dist; quit"
          exit_code=1
          for attempt in $(seq 1 "$SFTP_UPLOAD_ATTEMPTS"); do
            echo "Upload-Versuch $attempt/$SFTP_UPLOAD_ATTEMPTS"
            set +e
            timeout "${SFTP_UPLOAD_TIMEOUT_SECONDS}s" lftp -e "$lftp_script"
            exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              break
            fi
            if [ "$exit_code" -eq 124 ]; then
              break
            fi
            if [ "$attempt" -lt "$SFTP_UPLOAD_ATTEMPTS" ]; then
              sleep 15
            fi
          done
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ]; then
              echo "::error::Timeout beim Upload nach ${SFTP_UPLOAD_TIMEOUT_SECONDS}s."
            else
              echo "::error::Upload nach $SFTP_REMOTE_DIR fehlgeschlagen nach ${SFTP_UPLOAD_ATTEMPTS} Versuch(en) (Exit $exit_code)."
            fi
            exit 1
          fi

      - name: Inhalt des Document Root prüfen
        run: |
          set -euo pipefail
          auth_value="$SFTP_USERNAME"
          if [ -n "${SFTP_PASSWORD:-}" ]; then
            auth_value="$SFTP_USERNAME,$SFTP_PASSWORD"
          fi
          ssh_opts="-a -x -p $SFTP_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SFTP_KNOWN_HOSTS_FILE -o GlobalKnownHostsFile=/dev/null"
          if [ -n "${SFTP_SSH_KEY_FILE:-}" ]; then
            ssh_opts="$ssh_opts -i $SFTP_SSH_KEY_FILE"
          fi
          lftp_script="set cmd:fail-exit yes; set cmd:interactive false; set net:timeout $SFTP_CONNECT_TIMEOUT_SECONDS; set net:max-retries 1; set net:reconnect-interval-base 5; set net:reconnect-interval-multiplier 1; set sftp:connect-program \"ssh $ssh_opts\"; open -u $auth_value sftp://$SFTP_HOST:$SFTP_PORT; ls -la $SFTP_REMOTE_DIR; quit"
          exit_code=1
          listing=""
          for attempt in $(seq 1 "$SFTP_CHECK_ATTEMPTS"); do
            set +e
            listing="$(timeout "${SFTP_CHECK_TIMEOUT_SECONDS}s" lftp -e "$lftp_script")"
            exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt "$SFTP_CHECK_ATTEMPTS" ]; then
              sleep 15
            fi
          done
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ]; then
              echo "::error::Timeout bei Post-Upload-Document-Root-Prüfung nach ${SFTP_CHECK_TIMEOUT_SECONDS}s."
            else
              echo "::error::Post-Upload-Prüfung für $SFTP_REMOTE_DIR fehlgeschlagen (Exit $exit_code)."
            fi
            exit 1
          fi
          printf '%s\n' "$listing"

          printf '%s\n' "$listing" | grep -Eq '(^|/)index\.html$'
          printf '%s\n' "$listing" | grep -Eq '(^|/)assets/$'
          printf '%s\n' "$listing" | grep -Eq '(^|/)deploy-version\.txt$'

          if printf '%s\n' "$listing" | grep -Eq '(^|/)dist/$'; then
            echo "::error::$SFTP_REMOTE_DIR/dist/ wurde unerwartet angelegt."
            exit 1
          fi

      - name: Deployment online verifizieren
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ok=0
          for i in {1..24}; do
            response="$(curl --location --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
              https://www.sv-netzwerk.eu/deploy-version.txt || true)"
            if [ -n "$response" ]; then
              printf '%s\n' "$response"
              actual_sha="$(printf '%s\n' "$response" | sed -n 's/^Commit:[[:space:]]*//p' | head -n 1)"
              if [ "$actual_sha" = "$EXPECTED_SHA" ]; then
                ok=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Online-Commit stimmt nach Wartezeit nicht mit $EXPECTED_SHA überein."
            exit 1
          fi
