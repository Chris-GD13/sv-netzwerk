name: SV-Netzwerk bereitstellen

on:
  push:
    branches:
      - emergency-site-recovery
    paths:
      - "sv-netzwerk/**"
      - "!sv-netzwerk/docs/fachbeitrag-veroeffentlichungsprotokoll.csv"
      - "!sv-netzwerk/src/data/calendar-slots.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sv-netzwerk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SFTP_REMOTE_DIR: /sv-netzwerk
      SFTP_CONNECT_TIMEOUT_SECONDS: 25
      SFTP_CHECK_TIMEOUT_SECONDS: 45
      SFTP_UPLOAD_TIMEOUT_SECONDS: 1200

    defaults:
      run:
        working-directory: sv-netzwerk

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js 22 LTS einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sv-netzwerk/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Laufzeitumgebung prüfen
        run: |
          echo "Runner: $RUNNER_OS"
          echo "Arbeitsverzeichnis: $(pwd)"
          node --version
          npm --version
          npm config get registry
          test -f package.json
          test -f package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_PROGRESS: "false"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"
        run: npm ci --no-audit --no-fund --loglevel=notice

      - name: Astro-Projekt prüfen und bauen
        run: npm run build

      - name: Build-Ausgabe prüfen
        run: |
          set -euo pipefail
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          test -f dist/deploy-version.txt
          grep -Fx "Commit: $GITHUB_SHA" dist/deploy-version.txt
          grep -Fx "Version: Homepage-v5" dist/deploy-version.txt
          test -f dist/fachwissen/hochwasser-ueberflutung-grossschadenkoordination-2026-07-20-morning/index.html
          test -f dist/fachwissen/starkregen-rueckstau-schadenaufnahme-regulierung-2026-07-20-morning/index.html
          test -f dist/fachwissen/sturm-hagel-serienschaeden-prueffolge-2026-07-21-morning/index.html
          test -f dist/fachwissen/grossflaechige-leitungswasserschaeden-sanierungssteuerung/index.html
          test -f dist/intern/login/index.html
          test -f dist/assets/style.css
          echo "Build erfolgreich; erzeugte Dateien: $(find dist -type f | wc -l)"

      - name: SFTP-Werkzeug installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-client sshpass

      - name: Bestehende Server-Konfiguration unangetastet lassen
        run: |
          echo "Recovery-Upload verändert keine .env-, SharePoint-, Zugangskonfigurations- oder Logdateien."

      - name: Document Root mit nativer SFTP-Verbindung prüfen
        continue-on-error: true
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail
          batch_file="$(mktemp)"
          trap 'rm -f "$batch_file"' EXIT
          {
            printf 'cd "%s"\n' "$SFTP_REMOTE_DIR"
            printf 'pwd\n'
            printf 'quit\n'
          } > "$batch_file"
          export SSHPASS="$SFTP_PASSWORD"
          timeout "${SFTP_CHECK_TIMEOUT_SECONDS}s" sshpass -e sftp -4 \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oUserKnownHostsFile=/dev/null \
            -oConnectTimeout="$SFTP_CONNECT_TIMEOUT_SECONDS" \
            -oConnectionAttempts=1 \
            -P "$SFTP_PORT" \
            -b "$batch_file" \
            "$SFTP_USERNAME@$SFTP_HOST"

      - name: Vollständigen Recovery-Build nach IONOS übertragen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail
          batch_file="$(mktemp)"
          trap 'rm -f "$batch_file"' EXIT

          python3 - <<'PY' > "$batch_file"
          from pathlib import Path

          root = Path("dist")
          remote_root = "/sv-netzwerk"

          def excluded(rel: str) -> bool:
              return (
                  rel.startswith(".env")
                  or rel.endswith(".log")
                  or rel == "intern/photos"
                  or rel.startswith("intern/photos/")
              )

          def q(value: str) -> str:
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'

          print(f"cd {q(remote_root)}")

          dirs = []
          for path in root.rglob("*"):
              if not path.is_dir():
                  continue
              rel = path.relative_to(root).as_posix()
              if not rel or excluded(rel):
                  continue
              dirs.append(rel)
          dirs.sort(key=lambda p: (p.count('/'), p))
          for rel in dirs:
              print(f"-mkdir {q(rel)}")

          files = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              if excluded(rel) or rel == "deploy-version.txt":
                  continue
              files.append((rel, path.as_posix()))
          files.sort()
          for rel, local in files:
              print(f"put {q(local)} {q(rel)}")

          print(f"put {q('dist/deploy-version.txt')} {q('deploy-version.txt')}")
          print("quit")
          PY

          echo "Recovery-Batch enthält $(wc -l < "$batch_file") SFTP-Befehle."
          export SSHPASS="$SFTP_PASSWORD"
          timeout "${SFTP_UPLOAD_TIMEOUT_SECONDS}s" sshpass -e sftp -4 \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oUserKnownHostsFile=/dev/null \
            -oConnectTimeout="$SFTP_CONNECT_TIMEOUT_SECONDS" \
            -oConnectionAttempts=1 \
            -P "$SFTP_PORT" \
            -b "$batch_file" \
            "$SFTP_USERNAME@$SFTP_HOST"

      - name: Deployment online verifizieren
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ok=0
          for i in {1..24}; do
            response="$(curl --location --fail --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors \
              https://www.sv-netzwerk.eu/deploy-version.txt || true)"
            if [ -n "$response" ]; then
              printf '%s\n' "$response"
              actual_sha="$(printf '%s\n' "$response" | sed -n 's/^Commit:[[:space:]]*//p' | head -n 1)"
              if [ "$actual_sha" = "$EXPECTED_SHA" ]; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Online-Commit stimmt nach Wartezeit nicht mit $EXPECTED_SHA überein."
            exit 1
          fi
          echo "deploy-version.txt: OK"

          check_url() {
            label="$1"
            url="$2"
            status="$(curl --location --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors \
              -o /dev/null -w '%{http_code}' "$url" || true)"
            if [ "$status" != "200" ]; then
              echo "::error::$label liefert HTTP $status statt 200: $url"
              exit 1
            fi
            echo "$label: HTTP $status OK"
          }

          check_url "Homepage" "https://www.sv-netzwerk.eu/"
          check_url "Fachbeitrag Hochwasser" "https://www.sv-netzwerk.eu/fachwissen/hochwasser-ueberflutung-grossschadenkoordination-2026-07-20-morning/"
          check_url "Fachbeitrag Starkregen" "https://www.sv-netzwerk.eu/fachwissen/starkregen-rueckstau-schadenaufnahme-regulierung-2026-07-20-morning/"
          check_url "Interner Login" "https://www.sv-netzwerk.eu/intern/login/"
          check_url "Fachwissen Navigation" "https://www.sv-netzwerk.eu/fachwissen/"
          check_url "CSS" "https://www.sv-netzwerk.eu/assets/style.css"
          check_url "Team-Bild" "https://www.sv-netzwerk.eu/assets/images/team/christian-waechter-bw.webp"

          home="$(curl --location --fail --silent --show-error https://www.sv-netzwerk.eu/)"
          printf '%s' "$home" | grep -q '/fachwissen/'
          printf '%s' "$home" | grep -q '/leistungen/'
          printf '%s' "$home" | grep -Eq 'stylesheet|\.css'
          echo "Homepage-Navigation und Stylesheet-Verweis: OK"
