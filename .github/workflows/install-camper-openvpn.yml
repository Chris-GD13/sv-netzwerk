          cat >"$pki/server.crt" <<'PUBLIC_SERVER'
          -----BEGIN CERTIFICATE-----
          MIIEEjCCAnqgAwIBAgIQfZlLcDLrZAZFcJEaGsys+DANBgkqhkiG9w0BAQsFADAa
          MRgwFgYDVQQDEw9TcHJpbnRlciBWUE4gQ0EwHhcNMjYxMTIxMTY0OTQ2WhcNMjgx
          MTIxMTY0OTQ2WjAXMRUwEwYDVQQDDAxjYW1wZXItaW9ub3MwggGiMA0GCSqGSIb3
          DQEBAQUAA4IBjwAwggGKAoIBgQDgnr7OaTcmmVNWL0aKbrAPL+UslZc3kEHQI706
