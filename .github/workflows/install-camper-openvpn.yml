          bcM1xykHxUX1cnv/8zZmDffA1E7uahcwfxBRh11eotdmm2sIDRFurHVE1crn1WU0
          YrmceufgqlArN9/wGn2oKXCJpVdKH8AfW+lQMxSgPbmCUBx+b3kSZQoLSeLMD3g7
          3EqNgVpjoWk7xSZNOD6FPaN4y6r4TGcjUpTXOhrj+d4cMdM6R3CtA+7815iUyZOf
          8SnEqSXOpQABUfoxEwOW4MZ4iNtfW9vGu0oBvEyu8SlmC0gLlpUQKu/D57pEXgGr
          UHTW97GOeSSO6I4p5dn+RFd0aioivclbVC704hsMcjJ9WSSji8pv91mgUCQf8isF
          nJyK6O8BGBsE9nY3nhP0Zj/Np8VDn0/KjlWrOUwHEnsW0dTVIyaTBSCNMDCZbooT
          sOn409di+rwV3Kar195Od16WSom5ZXdaaY71RkKUa2GUtw8znI0=
          -----END CERTIFICATE-----
          PUBLIC_SERVER
          openssl verify -purpose sslserver -CAfile "$pki/ca.crt" "$pki/server.crt" >/dev/null
          cert_key=$(openssl x509 -in "$pki/server.crt" -pubkey -noout | openssl dgst -sha256)
          server_key=$(openssl pkey -in "$pki/server.key" -pubout | openssl dgst -sha256)
          test "$cert_key" = "$server_key"
          rollback() {
            systemctl disable --now openvpn-server@camper.service >/dev/null 2>&1 || true
            systemctl stop camper-vpn-guard.service >/dev/null 2>&1 || true
            rm -f /etc/openvpn/server/camper.conf /etc/openvpn/server/camper-clients/sprinter-router \
              /etc/camper-vpn-guard.nft /etc/systemd/system/camper-vpn-guard.service \
              /etc/systemd/system/openvpn-server@camper.service.d/guard.conf
            rmdir /etc/openvpn/server/camper-clients /etc/systemd/system/openvpn-server@camper.service.d 2>/dev/null || true
            systemctl daemon-reload
          }
          trap 'if [ "$?" != 0 ]; then rollback; fi' EXIT
          cat >/etc/camper-vpn-guard.nft <<'NFT'
          table inet camper_esp {
            chain input {
              type filter hook input priority -5; policy accept;
              iifname "tun-camper" ip saddr 192.168.1.112 tcp sport 6053 ct state established accept
              iifname "tun-camper" drop
            }
            chain output {
              type filter hook output priority -5; policy accept;
              oifname "tun-camper" ip daddr 192.168.1.112 tcp dport 6053 accept
              oifname "tun-camper" drop
            }
            chain forward {
              type filter hook forward priority -5; policy accept;
              iifname "tun-camper" ip saddr 192.168.1.112 tcp sport 6053 ct state established accept
              iifname "tun-camper" drop
              oifname "tun-camper" ip daddr 192.168.1.112 tcp dport 6053 accept
              oifname "tun-camper" drop
            }
            chain nat {
              type nat hook postrouting priority 90; policy accept;
              oifname "tun-camper" ip daddr 192.168.1.112 tcp dport 6053 masquerade
            }
          }
          NFT
          nft -c -f /etc/camper-vpn-guard.nft
          cat >/etc/systemd/system/camper-vpn-guard.service <<'UNIT'
          [Unit]
          Description=Restrict the camper VPN to the ESPHome API
          Before=openvpn-server@camper.service
          
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/nft -f /etc/camper-vpn-guard.nft
          ExecStop=/usr/sbin/nft delete table inet camper_esp
          UNIT
          install -d -m 755 /etc/systemd/system/openvpn-server@camper.service.d
          cat >/etc/systemd/system/openvpn-server@camper.service.d/guard.conf <<'DROPIN'
          [Unit]
          Requires=camper-vpn-guard.service
          After=camper-vpn-guard.service
          DROPIN
          install -d -m 755 /etc/openvpn/server/camper-clients
          cat >/etc/openvpn/server/camper-clients/sprinter-router <<'CLIENT'
          ifconfig-push 10.77.67.2 255.255.255.0
          iroute 192.168.1.112 255.255.255.255
          CLIENT
          chmod 644 /etc/openvpn/server/camper-clients/sprinter-router
          cat >/etc/openvpn/server/camper.conf <<'VPN'
          port 1194
          proto udp4
          dev tun-camper
          dev-type tun
          disable-dco
          topology subnet
          server 10.77.67.0 255.255.255.0
          route 192.168.1.112 255.255.255.255
          client-config-dir /etc/openvpn/server/camper-clients
          ccd-exclusive
          max-clients 1
          ca /var/lib/camper-openvpn/ca.crt
          cert /var/lib/camper-openvpn/server.crt
          key /var/lib/camper-openvpn/server.key
          dh none
          remote-cert-tls client
          tls-version-min 1.2
          data-ciphers AES-256-GCM:AES-128-GCM
          allow-compression no
          keepalive 15 90
          persist-key
          persist-tun
          user nobody
          group nogroup
          verb 3
          VPN
          systemctl daemon-reload
          if ! systemctl enable --now openvpn-server@camper.service; then
            journalctl -u openvpn-server@camper.service -u camper-vpn-guard.service -n 30 --no-pager
            exit 1
          fi
          sleep 2
          systemctl is-active --quiet openvpn-server@camper.service
          systemctl is-active --quiet camper-vpn-guard.service
          ss -Hlun 'sport = :1194' | grep -q .
          ip -4 route get 192.168.1.112 | grep -q 'dev tun-camper'
          echo 'Dedicated OpenVPN is active on UDP 1194'
          echo 'Tunnel restrictions and host route verified'
          trap - EXIT
          REMOTE
