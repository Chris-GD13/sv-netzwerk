name: Install Camper OpenVPN
on:
  push:
    branches: [codex/diagnose-camper-route-20261121]
    paths: [.github/workflows/install-camper-openvpn.yml]
permissions: {}
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install the isolated VPN service and its traffic limits
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PORTAL_SSH_KEY }}
          HOST: ${{ secrets.PORTAL_SFTP_HOST }}
          PORT: ${{ secrets.PORTAL_SFTP_PORT }}
          USER: ${{ secrets.PORTAL_SFTP_USERNAME }}
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$scratch/key"
          ssh-keyscan -T 8 -p "$PORT" "$HOST" > "$scratch/known_hosts" 2>/dev/null
          ssh -i "$scratch/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$scratch/known_hosts" -p "$PORT" "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          test "$(id -u)" = 0
          test "$(sysctl -n net.ipv4.ip_forward)" = 1
          test -c /dev/net/tun
          test -s /var/lib/camper-openvpn/server.key
          test ! -e /etc/openvpn/server/camper.conf
          test ! -e /etc/systemd/system/camper-vpn-guard.service
          test ! -e /etc/camper-vpn-guard.nft
          test ! -e /etc/openvpn/server/camper-clients
          test ! -e /etc/systemd/system/openvpn-server@camper.service.d
          if ss -Hlun 'sport = :1194' | grep -q .; then echo 'UDP 1194 is already in use'; exit 1; fi
          if ip -4 route show | grep -q '^10\.77\.67\.0/24'; then echo 'VPN address range is already in use'; exit 1; fi
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v openvpn >/dev/null; then
            package_log=$(mktemp)
            if ! apt-get update >"$package_log" 2>&1 || ! apt-get install -y --no-install-recommends openvpn >>"$package_log" 2>&1; then
              tail -30 "$package_log"
              rm -f "$package_log"
              exit 1
            fi
            rm -f "$package_log"
          fi
          command -v nft >/dev/null
          install -d -m 755 /etc/openvpn/server
          umask 077
          pki=/var/lib/camper-openvpn
          cat >"$pki/ca.crt" <<'PUBLIC_CA'
          -----BEGIN CERTIFICATE-----
          MIID/DCCAmSgAwIBAgIJAL5ypuvHeiVFMA0GCSqGSIb3DQEBCwUAMBoxGDAWBgNV
