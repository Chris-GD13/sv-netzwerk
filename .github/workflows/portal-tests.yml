name: Portal Tests

on:
  push:
    paths: ['sv-netzwerk/**']
  pull_request:
    paths: ['sv-netzwerk/**']
  schedule:
    - cron: '0 6 * * 1'  # Montags 6 Uhr

jobs:
  data-integrity:
    name: Datenintegritäts-Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: fensterpruefung
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl

      - name: Falltrennung der KI-Berichte prüfen
        run: php sv-netzwerk/tests/gf_case_isolation_test.php

      - name: Upload-Sperre für Signatur- und Profilbilder prüfen
        run: php sv-netzwerk/tests/upload_ignore_signatures_test.php

      - name: Schnelle Fallsuche prüfen
        run: php sv-netzwerk/tests/case_search_test.php

      - name: XLSM-Struktur der Excel-Dokumente prüfen
        run: php sv-netzwerk/tests/gf_excel_ooxml_test.php

      - name: KI-Kalkulationsentwurf prüfen
        run: php sv-netzwerk/tests/gf_calculation_draft_test.php

      - name: Stabilen Evidenz-Zwischenspeicher prüfen
        run: php sv-netzwerk/tests/gf_evidence_cache_test.php

      - name: Zusammengesetzte KI-Runtime prüfen
        run: |
          php -l sv-netzwerk/public/intern/api/gf-ai-generate-core.php
          php -l sv-netzwerk/public/intern/api/gf-ai-generate.php
          GF_AI_VALIDATE_ONLY=1 GF_AI_VALIDATE_TARGET=/tmp/gf-ai-runtime.php php sv-netzwerk/public/intern/api/gf-ai-generate.php
          php -l /tmp/gf-ai-runtime.php

      - name: Import Schema
        run: mysql -h 127.0.0.1 -u root -ptestpass fensterpruefung < sv-netzwerk/public/intern/api/schema.sql

      - name: Import Referenzdaten
        run: mysql -h 127.0.0.1 -u root -ptestpass fensterpruefung < analysis_export/testdata/referenz_seed.sql

      - name: Fallsuch-Register gegen MySQL prüfen
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: fensterpruefung
          DB_USER: root
          DB_PASS: testpass
        run: php sv-netzwerk/tests/case_search_registry_test.php

      - name: Datenintegrität prüfen
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: fensterpruefung
          DB_USER: root
          DB_PASS: testpass
        run: php tests/data_integrity_test.php

  integration:
    name: API-Integrationstests
    runs-on: ubuntu-latest
    needs: data-integrity
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: fensterpruefung
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl

      - name: Import Schema + Daten
        run: |
          mysql -h 127.0.0.1 -u root -ptestpass fensterpruefung < sv-netzwerk/public/intern/api/schema.sql
          mysql -h 127.0.0.1 -u root -ptestpass fensterpruefung < analysis_export/testdata/referenz_seed.sql

      - name: Testpasswörter setzen
        run: |
          HASH=$(php -r "echo password_hash('Test2026!', PASSWORD_ARGON2ID);")
          mysql -h 127.0.0.1 -u root -ptestpass fensterpruefung \
            -e "UPDATE users SET password_hash = '${HASH}' WHERE email IN ('admin@testprojekt.local','cw@sv-schuett.eu','hr@sv-schuett.eu','ms@sv-schuett.eu','gast@testprojekt.local')"

      - name: Create .env
        run: |
          cat > sv-netzwerk/public/intern/api/.env << 'EOF'
          DB_HOST=127.0.0.1
          DB_NAME=fensterpruefung
          DB_USER=root
          DB_PASS=testpass
          OPENAI_API_KEY=sk-test-dummy
          EOF

      - name: Start PHP Server
        run: |
          cd sv-netzwerk/public
          php -S 127.0.0.1:8080 &
          sleep 2

      - name: API-Tests ausführen
        run: php tests/integration_test.php http://127.0.0.1:8080/intern/api admin@testprojekt.local Test2026!
