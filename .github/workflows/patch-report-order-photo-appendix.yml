name: Gutachten Reihenfolge und Fotoanhang korrigieren

on:
  push:
    paths:
      - '.github/workflows/patch-report-order-photo-appendix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gutachtenexport anpassen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sv-netzwerk/src/lib/internal/client.ts')
          s = p.read_text(encoding='utf-8-sig')
          original = s

          old = """  const windowsHtml = items.map(({ record, photos }, index) => {"""
          new = """  const roomSortKey = (record: WindowRecord): number => {
    const raw = String(record.room_number || record.room_label || '').trim();
    const match = raw.match(/\\d+/);
    return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
  };
  const windowSortKey = (record: WindowRecord): number => {
    const raw = String(record.window_number || record.record_id || '').trim();
    const match = raw.match(/\\d+/);
    return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
  };
  const sortedItems = [...items].sort((a, b) =>
    roomSortKey(a.record) - roomSortKey(b.record)
    || windowSortKey(a.record) - windowSortKey(b.record)
    || String(a.record.window_number || a.record.record_id).localeCompare(String(b.record.window_number || b.record.record_id), 'de', { numeric: true, sensitivity: 'base' })
  );
  const windowsHtml = sortedItems.map(({ record }, index) => {"""
          if old not in s:
              raise SystemExit('Fenster-Mapping nicht gefunden')
          s = s.replace(old, new, 1)

          old = """    const photoHtml = photos.length ? photos.map((photo) => {
      const source = photoSources.get(photo.id);
      return `<figure>${source ? `<img src=\"${source}\" alt=\"${escapeHtml(photo.category)}\">` : '<div class=\"missing-photo\">Bilddatei nicht lesbar</div>'}<figcaption><strong>${escapeHtml(photo.category)}</strong><br>${escapeHtml(photo.caption || photo.file_name)}</figcaption></figure>`;
    }).join('') : '<p>Keine Fotos zugeordnet.</p>';
    return `<section class=\"window-report\"><h2>${index + 1}. Fenster ${escapeHtml(record.window_number || record.record_id)}</h2><p><strong>Standort:</strong> ${escapeHtml([record.building_label, record.section_label, record.floor_label, record.room_number || record.room_label].filter(Boolean).join(' · '))}</p>${sections}<h3>Fotodokumentation</h3><div class=\"photos\">${photoHtml}</div></section>`;
  }).join('');
  const attachments = documents.length"""
          new = """    return `<section class=\"window-report\"><h2>${index + 1}. Fenster ${escapeHtml(record.window_number || record.record_id)}</h2><p><strong>Standort:</strong> ${escapeHtml([record.building_label, record.section_label, record.floor_label, record.room_number || record.room_label].filter(Boolean).join(' · '))}</p>${sections}</section>`;
  }).join('');

  // Fotos bewusst nicht mehr einzelnen Fenstern zuordnen: Die aktuelle historische
  // Fotozuordnung ist nicht belastbar genug. Alle Bilder werden daher neutral und
  // ohne Beschriftung als gemeinsamer Anhang am Ende des Gutachtens ausgegeben.
  const appendixPhotos = sortedItems.flatMap(({ photos }) => photos.map((photo) => ({
    photo,
    source: photoSources.get(photo.id),
  })));
  const photoAppendix = appendixPhotos.length
    ? `<div class=\"photo-appendix\">${appendixPhotos.map(({ source }) => `<figure>${source ? `<img src=\"${source}\" alt=\"\">` : '<div class=\"missing-photo\">Bilddatei nicht lesbar</div>'}</figure>`).join('')}</div>`
    : '<p>Keine Fotos vorhanden.</p>';

  const attachments = documents.length"""
          if old not in s:
              raise SystemExit('Foto-/Fensterblock nicht gefunden')
          s = s.replace(old, new, 1)

          old = """  const bodyHtml = `<header><h1>Gutachten / Fensterprüfung</h1><p><strong>Objekt:</strong> ${escapeHtml(building)}<br><strong>Datenstand:</strong> ${escapeHtml(new Date().toLocaleString('de-DE'))}</p></header><section><h2>1. Zusammenfassung der Situation vor Ort</h2><p>${escapeHtml(overview)}</p><p><em>Dieser Überblick ist ein bearbeitbarer Entwurf und vor Fertigstellung sachverständig zu ergänzen und freizugeben.</em></p></section><section><h2>2. Einzeldokumentation der Fenster</h2>${windowsHtml}</section><section><h2>3. Anlagen aus dem Projektordner</h2>${attachments}</section>`;"""
          new = """  const bodyHtml = `<header><h1>Gutachten / Fensterprüfung</h1><p><strong>Objekt:</strong> ${escapeHtml(building)}<br><strong>Datenstand:</strong> ${escapeHtml(new Date().toLocaleString('de-DE'))}</p></header><section><h2>1. Zusammenfassung der Situation vor Ort</h2><p>${escapeHtml(overview)}</p><p><em>Dieser Überblick ist ein bearbeitbarer Entwurf und vor Fertigstellung sachverständig zu ergänzen und freizugeben.</em></p></section><section><h2>2. Einzeldokumentation der Fenster</h2>${windowsHtml}</section><section><h2>3. Anlagen aus dem Projektordner</h2>${attachments}</section><section class=\"photo-appendix-section\"><h2>4. Anlage Fotodokumentation</h2>${photoAppendix}</section>`;"""
          if old not in s:
              raise SystemExit('bodyHtml nicht gefunden')
          s = s.replace(old, new, 1)

          old_css = ".window-report{page-break-before:always}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photos figure{margin:0;page-break-inside:avoid}.photos img{height:7cm;max-height:7cm;width:auto;max-width:100%;object-fit:contain;border:1px solid #ccd7e0}.photos figcaption{font-size:8pt}.missing-photo{height:100px;border:1px dashed #a00;color:#a00;padding:8px}"
          new_css = ".window-report{page-break-before:always}.photo-appendix-section{page-break-before:always}.photo-appendix{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photo-appendix figure{margin:0;page-break-inside:avoid;text-align:center}.photo-appendix img{height:4.5cm;max-height:4.5cm;width:auto;max-width:100%;object-fit:contain;border:0}.missing-photo{height:70px;border:1px dashed #a00;color:#a00;padding:6px}"
          if old_css not in s:
              raise SystemExit('Gutachten-CSS nicht gefunden')
          s = s.replace(old_css, new_css, 1)

          if s == original:
              raise SystemExit('Keine Änderungen vorgenommen')
          p.write_text(s, encoding='utf-8')
          PY

          grep -Fq "const sortedItems = [...items].sort" sv-netzwerk/src/lib/internal/client.ts
          grep -Fq "4. Anlage Fotodokumentation" sv-netzwerk/src/lib/internal/client.ts
          grep -Fq "height:4.5cm" sv-netzwerk/src/lib/internal/client.ts
          if grep -Fq "<h3>Fotodokumentation</h3><div class=\"photos\">" sv-netzwerk/src/lib/internal/client.ts; then
            echo 'Alte fensterbezogene Fotodokumentation noch vorhanden' >&2
            exit 1
          fi

      - name: Build prüfen
        working-directory: sv-netzwerk
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sv-netzwerk/src/lib/internal/client.ts
          git commit -m "fix: Gutachten nach Raumnummer sortieren und Fotos als Anhang ausgeben"
          git push origin HEAD:main
