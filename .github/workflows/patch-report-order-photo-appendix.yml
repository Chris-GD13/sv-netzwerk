name: Gutachten Reihenfolge und Fotoanhang korrigieren

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_report_photo_appendix.py'
      - '.github/workflows/patch-report-order-photo-appendix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gutachtenexport patchen
        run: python3 .github/scripts/patch_report_photo_appendix.py
      - name: Build pruefen
        working-directory: sv-netzwerk
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Aenderungen committen
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sv-netzwerk/src/lib/internal/client.ts
          git commit -m "fix: Gutachten nach Raum sortieren und Fotos als Anhang ausgeben"
          git push origin HEAD:main
