name: Fachbeitrags-Automation

on:
  schedule:
    # Morgenslot 05:15-06:40 Europe/Berlin (DST-sicher via duale UTC-Crons)
    - cron: "20 3 * * *"  # Sommerzeit (CEST, UTC+2)
    - cron: "20 4 * * *"  # Winterzeit (CET, UTC+1)
    # Nachmittagsslot 16:15-17:30 Europe/Berlin (DST-sicher via duale UTC-Crons)
    - cron: "20 14 * * *" # Sommerzeit (CEST, UTC+2)
    - cron: "20 15 * * *" # Winterzeit (CET, UTC+1)
  workflow_dispatch:
    inputs:
      date:
        description: "Optionales Veröffentlichungsdatum im Format YYYY-MM-DD für Backfill"
        required: false
        type: string
      slot:
        description: "Erzwingt Zeitfenster (morning|afternoon); leer = automatische Slot-Erkennung"
        required: false
        type: choice
        options:
          - morning
          - afternoon

permissions:
  actions: write
  contents: write

concurrency:
  group: fachbeitrag-automation-main
  cancel-in-progress: false

jobs:
  publish-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ vars.FACHBEITRAG_AUTOMATION_ENABLED != 'false' }}
    defaults:
      run:
        working-directory: sv-netzwerk
    env:
      TZ: Europe/Berlin
      M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
      M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
      M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
      M365_CALENDAR_USER_ID: ${{ secrets.M365_CALENDAR_USER_ID }}
      CALENDAR_CASE_LOOKBACK_DAYS: 1095
      ALLOW_CALENDAR_CASE_CONTEXT: ${{ vars.ALLOW_CALENDAR_CASE_CONTEXT }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js 22 LTS einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sv-netzwerk/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Fachbeitrag erzeugen
        id: generate
        run: |
          SLOT_ARG=""
          DATE_ARG=""
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "20 3 * * *"|"20 4 * * *")
                SLOT_ARG="--slot=morning"
                ;;
              "20 14 * * *"|"20 15 * * *")
                SLOT_ARG="--slot=afternoon"
                ;;
            esac
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.slot }}" ]; then
            SLOT_ARG="--slot=${{ inputs.slot }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date=${{ inputs.date }}"
            EXTRA_ARGS="--allow-outside-window"
          fi
          node scripts/run-fachbeitrag-automation.mjs $SLOT_ARG $DATE_ARG $EXTRA_ARGS
          STATUS="$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('.automation/latest-publication.json','utf8'));process.stdout.write(data.status||'')")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "skipped" ]; then
            node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('.automation/latest-publication.json','utf8'));const existing=data.existingStatuses||{};const values={BERLIN_DATE:data.berlinDate||'',PUBLICATION_ID:data.publicationId||'',PUBLICATION_URL:data.articleUrl||'',PUBLICATION_TITLE:String(data.title||'').replace(/\n/g,' '),PUBLICATION_IMAGE_URL:data.imageUrl||'',PUBLICATION_SLUG:data.slug||'',PUBLICATION_SLOT:data.slot||'',PUBLICATION_RUNTIME_STATUS:data.status||'',PUBLICATION_COMMIT_HINT:data.commit||existing.commit||'',PUBLICATION_DEPLOY_STATUS:existing.deployStatus||'pending',PUBLICATION_LIVE_STATUS:existing.liveStatus||'pending',PUBLICATION_LINKEDIN_STATUS:existing.linkedinStatus||'pending'};for (const [key,value] of Object.entries(values)) console.log(key+'='+String(value));" >> "$GITHUB_ENV"
          fi

      - name: Bei Skip sauber beenden
        if: steps.generate.outputs.status == 'skipped'
        run: |
          REASON="$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('.automation/latest-publication.json','utf8'));process.stdout.write(data.reason||'unbekannt')")"
          echo "Kein Beitrag erzeugt: ${REASON}"

      - name: Vorprüfung
        if: steps.generate.outputs.status != 'skipped'
        run: node scripts/validate-fachbeitrag-preflight.mjs "$BERLIN_DATE"

      - name: Lint-/Fachbeitragsstandard prüfen
        if: steps.generate.outputs.status != 'skipped'
        run: |
          EXISTING_TODAY=$(node scripts/count-daily-articles.mjs "$BERLIN_DATE" 2>/dev/null || echo "0")
          npm run validate:knowledge -- "$BERLIN_DATE" "--expected-daily-count=${EXISTING_TODAY}"

      - name: Typprüfung ausführen
        if: steps.generate.outputs.status != 'skipped'
        run: npm run check

      - name: Build ausführen
        if: steps.generate.outputs.status != 'skipped'
        run: npm run build

      - name: HTML-Struktur validieren
        if: steps.generate.outputs.status != 'skipped'
        run: |
          npx --yes html-validate@9 --rule "long-title:off" \
            "dist/fachwissen/${PUBLICATION_SLUG}/index.html" \
            "dist/svos/fachwissen/${PUBLICATION_SLUG}/index.html"

      - name: Link- und Build-Integration prüfen
        if: steps.generate.outputs.status != 'skipped'
        run: npm run validate:knowledge -- --dist "$BERLIN_DATE"

      - name: Zeitfenster vor Commit erneut prüfen
        if: steps.generate.outputs.status != 'skipped'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            echo "Backfill-Lauf erkannt; Zeitfensterprüfung vor Commit wird übersprungen."
            exit 0
          fi
          node -e "const slot=process.env.PUBLICATION_SLOT;const now=new Date();const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);const p=(t)=>parts.find((x)=>x.type===t)?.value||'';const time=p('hour')+':'+p('minute');const windows={morning:['05:15','06:40'],afternoon:['16:15','17:30']};if(!windows[slot]){throw new Error('Unbekannter Slot: '+slot);}const [from,to]=windows[slot];if(time<from||time>to){throw new Error('Veröffentlichung außerhalb Zeitfenster blockiert: '+slot+' '+time+' Europe/Berlin (erlaubt '+from+'-'+to+')');}console.log('Zeitfenster OK: '+slot+' '+time+' Europe/Berlin');"

      - name: Commit und Push
        if: steps.generate.outputs.status != 'skipped'
        run: |
          if [ "$PUBLICATION_RUNTIME_STATUS" = "generated" ]; then
            if git diff --quiet; then
              echo "::error::Es wurden keine Änderungen erzeugt, obwohl der Generator einen Beitrag gemeldet hat."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/ public/assets/images/linkedin/ src/data/library.ts CHANGELOG.md docs/fachbeitrag-veroeffentlichungsprotokoll.csv
            git commit -m "chore: publish fachbeitrag ${BERLIN_DATE} ${PUBLICATION_SLOT}"
            git push origin HEAD:main
            echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "DEPLOY_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          else
            if [ -n "$PUBLICATION_COMMIT_HINT" ] && [ "$PUBLICATION_COMMIT_HINT" != "pending" ]; then
              echo "PUBLISHED_COMMIT=$PUBLICATION_COMMIT_HINT" >> "$GITHUB_ENV"
            else
              echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            fi
            echo "DEPLOY_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Veröffentlichungsprotokoll nach Push aktualisieren
        if: steps.generate.outputs.status != 'skipped'
        run: |
          if [ -n "$PUBLISHED_COMMIT" ] && [ "$PUBLISHED_COMMIT" != "pending" ]; then
            node scripts/update-fachbeitrag-log.mjs --commit="$PUBLISHED_COMMIT"
          fi
          if [ "$PUBLICATION_DEPLOY_STATUS" != "success" ]; then
            node scripts/update-fachbeitrag-log.mjs --deploy=triggered
          fi
          node -e "const fs=require('fs');const file='.automation/latest-publication.json';const data=JSON.parse(fs.readFileSync(file,'utf8'));data.commit=process.env.PUBLISHED_COMMIT||data.commit||'';data.existingStatuses={...(data.existingStatuses||{}),commit:data.commit||'',deployStatus:process.env.PUBLICATION_DEPLOY_STATUS==='success'?'success':'triggered',liveStatus:process.env.PUBLICATION_LIVE_STATUS||data.existingStatuses?.liveStatus||'pending',linkedinStatus:process.env.PUBLICATION_LINKEDIN_STATUS||data.existingStatuses?.linkedinStatus||'pending'};fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');"

      - name: Bestehenden Deploy-Workflow (push) abwarten
        if: steps.generate.outputs.status != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$PUBLICATION_RUNTIME_STATUS" = "generated" ]; then
            node scripts/trigger-and-await-workflow.mjs \
              --repo="${{ github.repository }}" \
              --workflow="deploy.yml" \
              --ref="main" \
              --event="push" \
              --dispatch=false \
              --head-sha="$DEPLOY_HEAD_SHA" \
              --timeout-seconds=2700
          elif [ "$PUBLICATION_DEPLOY_STATUS" != "success" ]; then
            node scripts/trigger-and-await-workflow.mjs \
              --repo="${{ github.repository }}" \
              --workflow="deploy.yml" \
              --ref="main" \
              --event="workflow_dispatch" \
              --dispatch=true \
              --head-sha="$DEPLOY_HEAD_SHA" \
              --timeout-seconds=2700
          fi
          echo "DEPLOY_OK=true" >> "$GITHUB_ENV"

      - name: Veröffentlichungsprotokoll nach Deploy-Check aktualisieren
        if: steps.generate.outputs.status != 'skipped'
        run: |
          node scripts/update-fachbeitrag-log.mjs --deploy=success
          node -e "const fs=require('fs');const file='.automation/latest-publication.json';const data=JSON.parse(fs.readFileSync(file,'utf8'));data.existingStatuses={...(data.existingStatuses||{}),deployStatus:'success',liveStatus:process.env.PUBLICATION_LIVE_STATUS||data.existingStatuses?.liveStatus||'pending',linkedinStatus:process.env.PUBLICATION_LINKEDIN_STATUS||data.existingStatuses?.linkedinStatus||'pending'};fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');"
