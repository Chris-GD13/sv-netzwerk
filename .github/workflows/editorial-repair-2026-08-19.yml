name: Fachbeitrag Redaktionelle Reparatur 2026-08-19

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/editorial-repair-2026-08-19.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: editorial-repair-2026-08-19
  cancel-in-progress: false

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sv-netzwerk
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sv-netzwerk/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Fachwissensübersicht auf neuen Fachbeitrag synchronisieren
        run: node scripts/sync-library-from-article.mjs grossflaechige-leitungswasserschaeden-sanierungssteuerung-3

      - name: Fachbeitragsstandard prüfen
        run: node scripts/validate-fachbeitrag-preflight.mjs 2026-08-19

      - name: Typprüfung
        run: npm run check

      - name: Build
        run: npm run build

      - name: Gebauten Fachbeitrag verifizieren
        run: |
          set -euo pipefail
          FILE="dist/fachwissen/grossflaechige-leitungswasserschaeden-sanierungssteuerung-3/index.html"
          test -f "$FILE"
          grep -Fq "Leitungswasserschäden in Estrich-Dämmschichten" "$FILE"
          grep -Fq "Quellen und weiterführende Regelwerke" "$FILE"
          if grep -Fq "Schadenfrequenz (2)" "$FILE"; then
            echo "::error::Alter Dubletten-Titel ist noch im Zielbeitrag enthalten."
            exit 1
          fi

      - name: Übersicht committen
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Keine zusätzliche Library-Änderung erforderlich."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/library.ts
            git commit -m "fix: Fachwissensübersicht auf qualifizierten Tagesbeitrag aktualisieren"
            git push origin HEAD:main
          fi

      - name: Produktiv-Deployment starten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Deployment gestartet."
