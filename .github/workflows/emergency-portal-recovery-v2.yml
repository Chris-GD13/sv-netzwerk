name: Prüfportal Recovery Deploy v2

on:
  push:
    paths:
      - '.github/workflows/emergency-portal-recovery-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-recovery-deploy-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: sv-netzwerk
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 LTS einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sv-netzwerk/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Portal bauen
        run: npm run build

      - name: Python SFTP-Client installieren
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko

      - name: Nur Prüfportal und benötigte Assets nach IONOS übertragen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          timeout 180s python3 - <<'PY'
          import os
          from pathlib import Path
          import paramiko

          host = os.environ['SFTP_HOST']
          user = os.environ['SFTP_USERNAME']
          password = os.environ['SFTP_PASSWORD']
          port = int(os.environ.get('SFTP_PORT') or '22')
          root = Path('dist')
          remote_root = '/sv-netzwerk'
          if not (root / 'intern' / 'index.html').is_file():
              raise SystemExit('dist/intern/index.html fehlt')

          transport = paramiko.Transport((host, port))
          transport.banner_timeout = 15
          transport.auth_timeout = 15
          transport.connect(username=user, password=password)
          sftp = paramiko.SFTPClient.from_transport(transport)
          sftp.get_channel().settimeout(20)

          def ensure_dir(path):
              cur = ''
              for part in path.strip('/').split('/'):
                  if not part:
                      continue
                  cur += '/' + part
                  try:
                      sftp.stat(cur)
                  except FileNotFoundError:
                      sftp.mkdir(cur)

          def upload_tree(local_dir, remote_dir, exclude_photos=False):
              count = 0
              if not local_dir.exists():
                  return count
              for src in local_dir.rglob('*'):
                  if not src.is_file():
                      continue
                  rel = src.relative_to(local_dir).as_posix()
                  if exclude_photos and (rel == 'photos' or rel.startswith('photos/')):
                      continue
                  remote = remote_dir.rstrip('/') + '/' + rel
                  ensure_dir(remote.rsplit('/', 1)[0])
                  sftp.put(str(src), remote)
                  count += 1
              return count

          ensure_dir(remote_root + '/intern')
          uploaded = upload_tree(root / 'intern', remote_root + '/intern', exclude_photos=True)

          # Vite/Astro-Bundles des Portals liegen typischerweise unter _astro.
          # Diese werden mit übertragen, ohne den restlichen Website-Bestand neu hochzuladen.
          uploaded += upload_tree(root / '_astro', remote_root + '/_astro')

          sftp.stat(remote_root + '/intern/index.html')
          print(f'Prüfportal-Recovery erfolgreich: {uploaded} Dateien übertragen.')
          sftp.close()
          transport.close()
          PY

      - name: Recovery bestätigt
        run: echo 'Prüfportal wurde gezielt und ohne Vollupload übertragen.'
