name: Deploy Recovery 2026-08-19

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-recovery-2026-08-19.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Produktiv-Deployment von main starten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Starte Produktiv-Deployment fuer den heutigen Fachbeitrag."
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Produktiv-Deployment von main wurde gestartet."
