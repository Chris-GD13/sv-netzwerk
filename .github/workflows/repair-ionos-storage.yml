name: IONOS-Dateispeicher verbinden

on:
  push:
    paths:
      - ".github/workflows/repair-ionos-storage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PORTAL_SFTP_HOST: ${{ secrets.PORTAL_SFTP_HOST }}
      PORTAL_SFTP_USERNAME: ${{ secrets.PORTAL_SFTP_USERNAME }}
      PORTAL_SFTP_PORT: ${{ secrets.PORTAL_SFTP_PORT }}
      PORTAL_SFTP_REMOTE_DIR: ${{ secrets.PORTAL_SFTP_REMOTE_DIR }}
      PORTAL_SSH_KEY: ${{ secrets.PORTAL_SSH_KEY }}
    steps:
      - name: SSH-Verbindung vorbereiten
        run: |
          set -euo pipefail
          test -n "$PORTAL_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PORTAL_SSH_KEY" > ~/.ssh/portal_key
          chmod 600 ~/.ssh/portal_key
          ssh-keyscan -p "$PORTAL_SFTP_PORT" "$PORTAL_SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: IONOS-Dateispeicher und Server-.env verbinden
        run: |
          set -euo pipefail
          test -n "$PORTAL_SFTP_REMOTE_DIR"
          remote_dir_q="$(printf '%q' "$PORTAL_SFTP_REMOTE_DIR")"
          ssh -i ~/.ssh/portal_key -o IdentitiesOnly=yes -o BatchMode=yes -p "$PORTAL_SFTP_PORT" "$PORTAL_SFTP_USERNAME@$PORTAL_SFTP_HOST" "REMOTE_DIR=$remote_dir_q bash -s" <<'REMOTE'
          set -euo pipefail
          storage_root=/srv/svnet-storage
          test "$storage_root" = /srv/svnet-storage
          test -x "$(command -v php)"
          if ! php -m | grep -qi '^pdo_sqlite$'; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes php-sqlite3
          fi
          php -m | grep -qi '^pdo_sqlite$'
          install -d -o www-data -g www-data -m 0770 "$storage_root" "$storage_root/objects" "$storage_root/versions" "$storage_root/locks" "$storage_root/intents"
          php -r '$p="/srv/svnet-storage/index.sqlite"; $db=new PDO("sqlite:".$p,null,null,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); $db->exec("CREATE TABLE IF NOT EXISTS items (id TEXT PRIMARY KEY,parent TEXT NOT NULL,name TEXT NOT NULL,mime TEXT NOT NULL,meta TEXT NOT NULL,path TEXT NOT NULL,verified INTEGER NOT NULL DEFAULT 1)");'
          knowledge_id="$(sed -n 's/^GOOGLE_DRIVE_KNOWLEDGE_FOLDER_ID=//p' "$REMOTE_DIR/.env" | tail -n 1 | sed 's/[[:space:]]*$//')"
          knowledge_id="${knowledge_id:-1QeJ4Dz6Upg_W5rahWmKE_7KbC4MMgSGe}"
          KNOWLEDGE_ID="$knowledge_id" php -r '$id=(string)getenv("KNOWLEDGE_ID"); $db=new PDO("sqlite:/srv/svnet-storage/index.sqlite",null,null,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); $columns=array_map(static fn(array $row):(string)$row["name"],$db->query("PRAGMA table_info(items)")->fetchAll(PDO::FETCH_ASSOC)); $pathColumn=in_array("path",$columns,true)?"path":(in_array("object_path",$columns,true)?"object_path":null); if($pathColumn===null) throw new RuntimeException("IONOS-Index ohne Objektpfadspalte"); $check=$db->prepare("SELECT 1 FROM items WHERE id=? LIMIT 1"); $check->execute([$id]); if(!$check->fetchColumn()){ $meta=json_encode(["id"=>$id,"name"=>"00_KI-Wissensbasis","mimeType"=>"application/vnd.google-apps.folder","parents"=>[],"trashed"=>false],JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE); $insert=$db->prepare("INSERT INTO items(id,parent,name,mime,meta,$pathColumn,verified) VALUES(?,?,?,?,?,?,1)"); $insert->execute([$id,"","00_KI-Wissensbasis","application/vnd.google-apps.folder",$meta,""]); } if((string)$db->query("PRAGMA integrity_check")->fetchColumn()!=="ok") throw new RuntimeException("IONOS-Index-Prüfung fehlgeschlagen");'
          sed -i '/^PORTAL_STORAGE_BACKEND=/d;/^IONOS_STORAGE_ROOT=/d' "$REMOTE_DIR/.env"
          printf '%s\n' 'PORTAL_STORAGE_BACKEND=ionos' 'IONOS_STORAGE_ROOT=/srv/svnet-storage' >> "$REMOTE_DIR/.env"
          chown -R www-data:www-data "$storage_root"
          chmod 0660 "$storage_root/index.sqlite"
          test -r "$storage_root/index.sqlite"
          test -w "$storage_root/objects"
          echo "IONOS-Dateispeicher verbunden"
          REMOTE
