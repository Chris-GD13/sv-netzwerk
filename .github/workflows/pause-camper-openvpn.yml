name: Pause Camper OpenVPN
on:
  push:
    branches: [codex/diagnose-camper-route-20261121]
    paths: [.github/workflows/pause-camper-openvpn.yml]
permissions: {}
jobs:
  pause:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Pause the new VPN service and verify existing connectivity
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PORTAL_SSH_KEY }}
          HOST: ${{ secrets.PORTAL_SFTP_HOST }}
          PORT: ${{ secrets.PORTAL_SFTP_PORT }}
          USER: ${{ secrets.PORTAL_SFTP_USERNAME }}
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$scratch/key"
          ssh-keyscan -T 8 -p "$PORT" "$HOST" > "$scratch/known_hosts" 2>/dev/null
          ssh -i "$scratch/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$scratch/known_hosts" -p "$PORT" "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          test -f /etc/openvpn/server/camper.conf
          systemctl disable --now openvpn-server@camper.service
          systemctl stop camper-vpn-guard.service
          ! systemctl is-active --quiet openvpn-server@camper.service
          ! systemctl is-active --quiet camper-vpn-guard.service
          if ss -Hlun 'sport = :1194' | grep -q .; then exit 1; fi
          echo 'Camper OpenVPN stopped; UDP 1194 has no server listener'
          test -n "$(wg show interfaces)"
          echo 'Existing WireGuard is active'
          test "$(docker inspect --format '{{.State.Running}}' anker-homeassistant)" = true
          echo 'Home Assistant is running'
          REMOTE
