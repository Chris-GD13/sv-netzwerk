name: SharePoint-Dublettenlogik anwenden

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sharepoint-dedupe-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dublettenlogik direkt patchen
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('sv-netzwerk/public/intern/api/sharepoint-v2.php')
          s = path.read_text(encoding='utf-8')

          helper = r'''
function v2DedupeGroupRows(array $rows): array
{
    $bySash = [];
    foreach ($rows as $index => $row) {
        $opening = v2NormalizeKey((string) ($row['__opening_type'] ?? v2DetectOpeningType($row)));
        $position = v2NormalizeKey((string) ($row['__position'] ?? ''));
        $sashKey = $opening !== '' ? 'opening:' . $opening : ($position !== '' ? 'position:' . $position : 'row:' . $index);

        if (!isset($bySash[$sashKey])) {
            $row['__merge_conflicts'] = is_array($row['__merge_conflicts'] ?? null) ? $row['__merge_conflicts'] : [];
            $bySash[$sashKey] = $row;
            continue;
        }

        $base = $bySash[$sashKey];
        foreach ($row as $field => $value) {
            if ($field === '__merge_conflicts') continue;
            $incoming = trim((string) $value);
            if ($incoming === '') continue;
            $current = trim((string) ($base[$field] ?? ''));
            if ($current === '') {
                $base[$field] = $value;
                continue;
            }
            if ($current !== $incoming && !str_starts_with((string) $field, '__')) {
                $base['__merge_conflicts'][$field] = array_values(array_unique(array_merge(
                    (array) ($base['__merge_conflicts'][$field] ?? []),
                    [$current, $incoming]
                )));
            }
        }
        $bySash[$sashKey] = $base;
    }

    $merged = array_values($bySash);
    usort($merged, static fn($a, $b) => v2OpeningPriority($a) <=> v2OpeningPriority($b));
    return $merged;
}

'''
          if 'function v2DedupeGroupRows(array $rows): array' not in s:
              anchor = 'function handleApplyExcelV2(array $user): never'
              if anchor not in s:
                  raise SystemExit('handleApplyExcelV2 nicht gefunden')
              s = s.replace(anchor, helper + anchor, 1)

          pattern = re.compile(
              r"    \$groups = \[\];\n"
              r"    foreach \(\$canonicalRows as \$row\) \{\n"
              r"        \$windowNumber = v2NormalizeWindowNumber\([^\n]+\);\n"
              r"        \$room = trim\(\(string\) \(\$row\['__room_reference'\] \?\? ''\)\);\n"
              r"        if \(\$windowNumber === '' \|\| \$room === ''\) continue;\n"
              r"        \$key = v2NormalizeKey\(\$room\) \. '\|' \. v2NormalizeKey\(\$windowNumber\);\n"
              r"        if \(!isset\(\$groups\[\$key\]\)\) \$groups\[\$key\] = \['room' => \$room, 'window' => \$windowNumber, 'rows' => \[\]\];\n"
              r"        \$groups\[\$key\]\['rows'\]\[\] = \$row;\n"
              r"    \}\n"
          )
          replacement = """    $groups = [];
    foreach ($canonicalRows as $row) {
        $windowNumber = v2NormalizeWindowNumber($row['__window_number'] ?? ($row['schlagzahl'] ?? ''));
        $room = trim((string) ($row['__room_reference'] ?? ''));
        $floor = trim((string) ($row['__floor_label'] ?? '')) ?: 'EG / Erdgeschoss';
        if ($windowNumber === '' || $room === '') continue;
        $key = v2NormalizeKey($floor) . '|' . v2NormalizeKey($room) . '|' . v2NormalizeKey($windowNumber);
        if (!isset($groups[$key])) $groups[$key] = ['floor' => $floor, 'room' => $room, 'window' => $windowNumber, 'rows' => []];
        $groups[$key]['rows'][] = $row;
    }
    foreach ($groups as &$group) {
        $group['rows'] = v2DedupeGroupRows($group['rows']);
    }
    unset($group);
"""
          if "v2NormalizeKey($floor) . '|' . v2NormalizeKey($room)" not in s:
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit('Gruppierungsblock konnte nicht eindeutig ersetzt werden')

          s = s.replace(
              "$floorLabel = trim((string) ($groupRows[0]['__floor_label'] ?? '')) ?: 'EG / Erdgeschoss';",
              "$floorLabel = trim((string) ($group['floor'] ?? ($groupRows[0]['__floor_label'] ?? ''))) ?: 'EG / Erdgeschoss';",
              1,
          )

          path.write_text(s, encoding='utf-8')
          PY

      - name: PHP-Syntax und Schutzlogik prüfen
        shell: bash
        run: |
          set -euo pipefail
          php -l sv-netzwerk/public/intern/api/sharepoint-v2.php
          grep -Fq 'function v2DedupeGroupRows' sv-netzwerk/public/intern/api/sharepoint-v2.php
          grep -Fq 'v2NormalizeKey($floor)' sv-netzwerk/public/intern/api/sharepoint-v2.php
          grep -Fq "v2DedupeGroupRows(\$group['rows'])" sv-netzwerk/public/intern/api/sharepoint-v2.php

      - name: Commit und Push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Dublettenlogik ist bereits aktiv.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sv-netzwerk/public/intern/api/sharepoint-v2.php
          git commit -m 'fix: Excel-Dubletten nach Etage Raum Fenster und Fluegel konsolidieren'
          git push origin HEAD:main
