name: Camper route diagnostics
on:
  push:
    branches: [codex/diagnose-camper-route-20261121]
    paths: [.github/workflows/camper-route-diagnostics.yml]
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check the IONOS network path without changing it
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PORTAL_SSH_KEY }}
          HOST: ${{ secrets.PORTAL_SFTP_HOST }}
          PORT: ${{ secrets.PORTAL_SFTP_PORT }}
          USER: ${{ secrets.PORTAL_SFTP_USERNAME }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$work/key"
          ssh-keyscan -T 8 -p "$PORT" "$HOST" > "$work/known_hosts" 2>/dev/null
          ssh -i "$work/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$work/known_hosts" -p "$PORT" "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          id -u | awk '{print "Admin SSH: " ($1 == 0 ? "yes" : "no")}'
          if command -v wg >/dev/null; then echo 'WireGuard installed: yes'; fi
          if command -v openvpn >/dev/null; then echo 'OpenVPN installed: yes'; else echo 'OpenVPN installed: no'; fi
          route=$(ip -4 route get 192.168.1.112 2>/dev/null || true)
          case "$route" in
            *' dev wg'*|*' dev tun'*) echo 'Camper route uses a VPN interface';;
            *' via '*) echo 'Camper route uses a gateway';;
            '') echo 'Camper route lookup failed';;
            *) echo 'Camper route uses another interface';;
          esac
          if command -v docker >/dev/null && docker ps --format '{{.Image}}' 2>/dev/null | grep -qi 'home.assistant'; then
            echo 'Home Assistant container present: yes'
          else
            echo 'Home Assistant container visible: no'
          fi
          if timeout 4 bash -c 'exec 3<>/dev/tcp/192.168.1.112/6053' 2>/dev/null; then
            echo 'ESPHome port reachable from IONOS: yes'
          else
            echo 'ESPHome port reachable from IONOS: no'
          fi
          REMOTE
