name: Massenänderung Navigation ergänzen

on:
  push:
    paths:
      - '.github/workflows/add-bulk-edit-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Navigation ergänzen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sv-netzwerk/src/lib/internal/client.ts')
          s = p.read_text(encoding='utf-8-sig')
          link = '    <a class="sv-button sv-button-secondary" href="${pb}/massenaenderung/">Massenänderung</a>\n'
          if '/massenaenderung/' not in s:
              marker = '    <a class="sv-button sv-button-secondary" href="${pb}/gutachten/">Gutachten</a>\n'
              if marker in s:
                  s = s.replace(marker, marker + link, 1)
              else:
                  marker = '    <a class="sv-button sv-button-secondary" href="${pb}/gebaeude/">Gebäude</a>\n'
                  if marker not in s:
                      raise SystemExit('Navigationsanker nicht gefunden')
                  s = s.replace(marker, marker + link, 1)
              p.write_text(s, encoding='utf-8')
          PY
          grep -Fq '/massenaenderung/' sv-netzwerk/src/lib/internal/client.ts
      - name: Build prüfen
        working-directory: sv-netzwerk
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Änderung committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sv-netzwerk/src/lib/internal/client.ts
          git commit -m "feat: Massenänderung im Prüfportal-Menü anzeigen"
          git push origin HEAD:main
