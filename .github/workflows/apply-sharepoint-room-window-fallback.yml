name: Apply SharePoint room-window fallback

on:
  push:
    paths:
      - 'sv-netzwerk/scripts/patch-sharepoint-room-window-fallback.py'
      - '.github/workflows/apply-sharepoint-room-window-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        working-directory: sv-netzwerk
        run: python3 scripts/patch-sharepoint-room-window-fallback.py
      - name: Validate PHP
        run: php -l sv-netzwerk/public/intern/api/sharepoint-v2.php
      - name: Commit result
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sv-netzwerk/public/intern/api/sharepoint-v2.php
          git commit -m "fix: SharePoint Zimmer- und Fensternummer robust erkennen"
          git push origin HEAD:main
