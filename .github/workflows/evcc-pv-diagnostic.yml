name: Inspect evcc restart
on:
  push:
    branches: [codex/evcc-server-check]
    paths: [.github/workflows/evcc-pv-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read available energy inputs without changes
        env:
          SERVER_HOST: ${{ secrets.PORTAL_SFTP_HOST }}
          SERVER_USER: ${{ secrets.PORTAL_SFTP_USERNAME }}
          SERVER_PORT: ${{ secrets.PORTAL_SFTP_PORT }}
          SERVER_KEY: ${{ secrets.PORTAL_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$SERVER_KEY"
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/evcc_check_key' EXIT
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/evcc_check_key
          chmod 600 ~/.ssh/evcc_check_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/evcc_check_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'sh -s' <<'CHECK'
          set -eu
          docker ps -a --filter name=evcc-energy --format '{{.Names}} {{.Status}}'
          docker logs --tail 35 evcc-energy 2>&1 | sed -E 's/(token|password|secret|Authorization)([^ ]*)/[REDACTED]/Ig'
          python3 - <<'PY'
          import urllib.request,json
          try:
           r=urllib.request.urlopen('http://10.77.66.1:7070/api/state',timeout=10)
           d=json.load(r); d=d.get('result',d)
           print('STATE',json.dumps({k:d.get(k) for k in ['pv','battery','grid']}))
          except Exception as e: print(type(e).__name__)
          PY
          CHECK
