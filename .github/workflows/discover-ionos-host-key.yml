name: IONOS SSH Hostschlüssel prüfen

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/discover-ionos-host-key.yml"

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Öffentlichen IONOS-Hostschlüssel auslesen
        run: |
          set -euo pipefail
          host="217.160.143.102"
          port="22"
          keys="$(ssh-keyscan -T 10 -p "$port" "$host" 2>/dev/null)"
          test -n "$keys"
          printf '%s\n' "$keys" > /tmp/ionos_known_hosts
          ssh-keygen -lf /tmp/ionos_known_hosts -E sha256
