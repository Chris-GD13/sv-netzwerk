<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Google-Drive-Konfiguration</title></head>
<body>
<h1>Google-Drive-Konfiguration</h1>
<form id="config">
<label>Client-ID <input id="client_id" autocomplete="off" required></label><br>
<label>Client-Secret <input id="client_secret" type="password" autocomplete="off" required></label><br>
<button type="submit">Konfiguration speichern</button>
</form>
<pre id="result" role="status"></pre>
<script>
document.getElementById('config').addEventListener('submit', async (event) => {
  event.preventDefault();
  const result = document.getElementById('result');
  result.textContent = 'Speichere …';
  const response = await fetch('/intern/api/google-drive-oauth.php?action=save_client', {
    method: 'POST',
    credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      client_id: document.getElementById('client_id').value.trim(),
      client_secret: document.getElementById('client_secret').value.trim()
    })
  });
  result.textContent = await response.text();
});
</script>
</body>
</html>
