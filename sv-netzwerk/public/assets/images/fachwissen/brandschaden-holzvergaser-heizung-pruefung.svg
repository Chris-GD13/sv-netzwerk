  <text x="1050" y="355" font-size="52" font-weight="700">an der Heizung</text>
  <text x="1050" y="440" font-size="30" opacity=".85">Brandbefund, Löschwasser und</text>
  <text x="1050" y="482" font-size="30" opacity=".85">Wiederinbetriebnahme getrennt prüfen</text>
</g>
