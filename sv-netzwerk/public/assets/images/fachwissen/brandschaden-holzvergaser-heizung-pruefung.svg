<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Holzvergaser-Heizung nach einem Brandschaden</title>
<desc id="desc">Abstrakte fachliche Darstellung eines Heizkessels mit getrennten Bereichen für Brandspuren, Löschwasser und technische Prüfung.</desc>
<defs>
